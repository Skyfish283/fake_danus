<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research graph</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #141a22;
    --panel-2: #1b232d;
    --line: #263140;
    --text: #d8e0ea;
    --muted: #7d8b9c;
    --promising: #34d399;
    --obstacle: #fbbf24;
    --idea: #60a5fa;
    --unverified: #93a3b6;
    --paper: #c084fc;
    --dead: #566070;
    --rejected: #ef7c7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
  #problem {
    color: var(--muted);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #stats { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #status-pill {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    white-space: nowrap;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  #status-pill.live { color: var(--promising); border-color: #245c46; }
  #status-pill.done { color: var(--idea); border-color: #23415e; }
  #status-pill.lost { color: var(--rejected); border-color: #5e2a2a; }

  main { flex: 1; display: flex; min-height: 0; }

  #canvas-wrap { position: relative; flex: 1; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.panning { cursor: grabbing; }

  #toolbar {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4a5e; }
  button.on { color: #0d1117; background: var(--idea); border-color: var(--idea); }

  aside {
    width: 380px;
    flex: none;
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside section { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }

  #legend { display: flex; flex-direction: column; gap: 3px; }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    user-select: none;
  }
  .legend-row:hover { background: var(--panel-2); }
  .legend-row.off { opacity: 0.35; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-row span:nth-child(2) { flex: 1; }
  .legend-count { color: var(--muted); font-variant-numeric: tabular-nums; }

  #detail { flex: none; max-height: 42%; overflow: auto; }
  #detail .empty { color: var(--muted); }
  #detail .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #detail .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  #detail .content { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  #detail .meta { color: var(--muted); font-size: 12px; }
  #detail ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }

  #feed-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 0; }
  #feed { overflow: auto; flex: 1; font-size: 12px; }
  .feed-row { display: flex; gap: 7px; padding: 2px 0; border-bottom: 1px solid #1b2229; }
  .feed-row .t { color: #55616f; font-variant-numeric: tabular-nums; flex: none; }
  .feed-row .who { flex: none; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-row .what { flex: 1; color: var(--muted); word-break: break-word; }
  .who.planner { color: #67e8f9; }
  .who.explorer { color: var(--promising); }
  .who.mathematician { color: var(--obstacle); }
  .who.skeptic { color: var(--paper); }
  .who.literature { color: var(--idea); }
  .feed-row.task_failed .what { color: var(--rejected); }

  /* graph */
  .edge { stroke: #3a4757; stroke-width: 1.2; fill: none; }
  .edge.dashed { stroke-dasharray: 5 4; stroke: #7a5a5a; }
  .edge.faded { opacity: 0.07; }
  .node circle { stroke: #0d1117; stroke-width: 1.5; cursor: pointer; }
  .node.root circle { stroke: #8b97a6; stroke-width: 2.5; }
  .node.selected circle { stroke: #ffffff; stroke-width: 2.5; }
  .node.faded { opacity: 0.07; pointer-events: none; }
  .node text {
    fill: var(--text);
    font-size: 10px;
    pointer-events: none;
    paint-order: stroke;
    stroke: #0d1117;
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node .snippet { fill: var(--muted); }
  .node.fresh circle { animation: pulse 2.2s ease-out; }
  @keyframes pulse {
    0%   { stroke: #ffffff; stroke-width: 12; }
    100% { stroke: #0d1117; stroke-width: 1.5; }
  }
</style>
</head>
<body>

<header>
  <h1>Research graph</h1>
  <div id="problem">waiting for the run...</div>
  <div id="stats"></div>
  <div id="status-pill">connecting</div>
</header>

<main>
  <div id="canvas-wrap">
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">

        </marker>
        <marker id="arrow-dashed" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 7 4 L 0 7 z" fill="#7a5a5a"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edge-layer"></g>
        <g id="node-layer"></g>
      </g>
    </svg>
    <div id="toolbar">
      <button id="btn-pause">Pause layout</button>
      <button id="btn-fit">Fit</button>
      <button id="btn-dead">Hide dead ends</button>
      <button id="btn-unpin">Release pinned</button>
    </div>
  </div>

  <aside>
    <section>
      <h2>Status</h2>
      <div id="legend"></div>
    </section>
    <section id="detail">
      <h2>Node</h2>
      <div class="empty">Click a node to read it in full.</div>
    </section>
    <section id="feed-section">
      <h2>Activity</h2>
      <div id="feed"></div>
    </section>
  </aside>
</main>

<script>
window.STATIC_STATE = {"changed": true, "run": "20260909-205703", "run_dir": "C:\\Users\\samfe\\OneDrive\\Desktop\\math_agent\\math_agent\\runs\\20260909-205703", "problem": "Consider a parameter estimation rejection approximate bayesian computation algorithm, with MMD as the discreprancy measure rather than a summary statistic. How does the spectral properties, or other properties of the kernel of the MMD affect the convergence rate of the algorithm?", "nodes": {"problem": {"id": "problem", "type": "problem", "content": "Consider a parameter estimation rejection approximate bayesian computation algorithm, with MMD as the discreprancy measure rather than a summary statistic. How does the spectral properties, or other properties of the kernel of the MMD affect the convergence rate of the algorithm?", "status": "UNVERIFIED", "created_by": "user", "created_at": 1788953223.0969644, "updated_at": 1788953223.0969646, "history": []}, "paper_1": {"id": "paper_1", "type": "paper", "content": "Cherief-Abdellatif & Alquier (2020) establish consistency and exponential contraction rates for generalized Bayesian inference using MMD as loss, governed by bracketing entropy and modulus of continuity.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1788953273.741666, "updated_at": 1788953273.7416666, "history": []}, "lemma_1": {"id": "lemma_1", "type": "lemma", "content": "Spectral representation of squared MMD: MMD^2(P_0, P_theta) = sum_{j=1}^infty lambda_j (mu_{0,j} - mu_{theta,j})^2, where lambda_j are kernel integral operator eigenvalues. Rapid eigenvalue decay (e.g. Gaussian kernels) heavily damps high-frequency discrepancies, leading to an ill-posed inverse map theta -> MMD.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953273.7485666, "updated_at": 1788953273.7485669, "history": []}, "obstacle_1": {"id": "obstacle_1", "type": "obstacle", "content": "ABC rejection uses an indicator filter I(widehat{MMD}_n <= epsilon), differing from the Gibbs/generalized posterior exp(-gamma_n n MMD^2) studied in literature. Analyzing joint limits n, m -> inf and epsilon -> 0 requires delicate control of ABC bias-variance trade-offs.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1788953273.7568626, "updated_at": 1788954647.4301379, "history": [], "notes": [{"at": 1788953514.0567725, "by": "planner", "note": "Confirmed by decomposer: hard rejection indicator discontinuity lacks smoothness of exponential Gibbs weights, requiring U-process large deviations."}, {"at": 1788954647.430136, "by": "planner", "note": "Toy model analysis demonstrates that replacing the non-Lipschitz indicator I(widehat{MMD}_n^2 <= epsilon_n^2) with a smoothed exponential weight exp(-gamma_n W_n) resolves the boundary discontinuity obstacle and permits standard Gibbs posterior contraction proofs."}]}, "obstacle_2": {"id": "obstacle_2", "type": "obstacle", "content": "Simulation vs data sample size asymmetry: empirical MMD between size n (observed) and size m (simulated) has variance dominated by min(n, m), creating difficulties when m is large but n is fixed in ABC.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1788953273.7640672, "updated_at": 1788954175.3004007, "history": [], "notes": [{"at": 1788954175.3003993, "by": "planner", "note": "Task 54 confirmed empirical MMD variance decomposes as O(1/n + 1/m). Thus, maintaining statistical rate parity requires simulation sample size m(n) = Omega(n)."}]}, "hypothesis_1": {"id": "hypothesis_1", "type": "hypothesis", "content": "The Smoothness Dilemma in MMD-ABC: The posterior contraction rate is governed by a trade-off between the empirical MMD convergence rate $O_p(n^{-\\alpha})$ and the parameter identifiability modulus $MMD(P_\\theta, P_0) \\ge c \\|\\theta - \\theta_0\\|^\\beta$. Smooth kernels (exponential spectral decay, e.g., Gaussian) yield fast empirical rates $\\alpha \\approx 1/2$ but poor sensitivity (large $\\beta$), whereas rougher kernels (polynomial spectral decay, e.g., Matérn) preserve sensitivity (smaller $\\beta$) but suffer from slow empirical rates $\\alpha$ in high dimensions.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953325.6137896, "updated_at": 1788954556.09869, "history": [], "notes": [{"at": 1788954394.2081418, "by": "planner", "note": "Refined by toy example findings: in location families, the smoothness dilemma does not manifest as a changing identifiability exponent $\\beta$ (which remains $\\beta = 1$ for all Matérn kernels), but rather as a variance breakdown threshold $s \\le d/4$ versus the dimension-dependent preconstant curse for smooth kernels."}, {"at": 1788954556.0986886, "by": "planner", "note": "The smoothness and identifiability trade-off must be restricted to bounded kernels to prevent moment divergence issues highlighted in heavy-tailed counterexamples."}]}, "obstacle_3": {"id": "obstacle_3", "type": "obstacle", "content": "Curse of Dimensionality in Mercer Spectral Decay: For a kernel with smoothness $s$ on a $d$-dimensional domain, Mercer eigenvalues decay as $\\lambda_j \\sim j^{-2s/d}$. In high dimensions, this decay is extremely slow unless the smoothness $s$ is very large. Slow decay increases the effective dimension of the RKHS, which inflates the variance of empirical MMD estimators and severely degrades the MMD-ABC convergence rate.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1788953325.6209025, "updated_at": 1788954527.9235492, "history": [], "notes": [{"at": 1788954527.9235477, "by": "planner", "note": "Confirmed via rank-1 linear kernel toy example that infinite-dimensional spectral decay is necessary for the dimensionality curse; finite-dimensional or rank-deficient kernels bypass variance inflation and preconstant decay."}]}, "paper_2": {"id": "paper_2", "type": "paper", "content": "Bernton, Jacob, Gerber, and Robert (2019) 'Approximate Bayesian Computation with the Wasserstein Distance'. Establishes posterior contraction rates for rejection ABC using Wasserstein distance W_1 by bounding the denominator via small-ball probabilities of W_1(P_hat_n, P_0) and utilizing a modulus of continuity for parameter identifiability: W_1(P_theta, P_0) >= c ||theta - theta_0||^beta.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1788953536.7864857, "updated_at": 1788953536.7864866, "history": []}, "idea_1": {"id": "idea_1", "type": "idea", "content": "Spectral Truncation for MMD-ABC Rejection Bounds: To bound the rejection probability P(MMD_hat_n^2 <= epsilon_n^2) under P_theta, we can project the empirical MMD onto the subspace spanned by the top K_n eigenfunctions of the kernel integral operator. The first K_n components enjoy parametric convergence rates, while the tail sum_{j > K_n} lambda_j is controlled by the kernel's spectral decay. Choosing K_n optimally to balance truncation error and estimation variance allows bounding the small-ball probability, bypassing the hard-threshold indicator obstacle.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953536.7929878, "updated_at": 1788954425.7347016, "history": [], "notes": [{"at": 1788954425.7347, "by": "planner", "note": "Subgoal 1 (spectral truncation variance and tail bound) successfully formalized."}]}, "paper_3": {"id": "paper_3", "type": "paper", "content": "Frazier, Martin, Robert, & Rousseau (2018) 'Asymptotic properties of approximate Bayesian computation' (arXiv:1803.10986). This work establishes that posterior contraction in rejection ABC is driven by the small-ball probabilities of the chosen discrepancy measure near zero, providing a blueprint for the asymptotic analysis of MMD-ABC.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1788953596.5907063, "updated_at": 1788953596.5907073, "history": []}, "paper_4": {"id": "paper_4", "type": "paper", "content": "Sriperumbudur, Gretton, Györfi, Schölkopf, & Lanckriet (2010) 'Hilbert Space Embeddings and Metrics on Probability Measures'. This paper links the spectral properties (Fourier transform / eigenvalue decay) of kernel integral operators to the topological and convergence metrization properties of MMD.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1788953596.6094878, "updated_at": 1788953596.609489, "history": []}, "counterexample_1": {"id": "counterexample_1", "type": "counterexample", "content": "Explicit calculation of $\\text{MMD}^2(P_0, P_\\theta)$ for 1D Gaussian location families $P_0 = \\mathcal{N}(0,1)$ and $P_\\theta = \\mathcal{N}(\\theta,1)$ using a Gaussian kernel $k_h(x,y) = \\exp(-(x-y)^2/(2h^2))$ via Fourier representation: $\\text{MMD}^2(P_0, P_\\theta) = \\frac{h}{\\sqrt{2+h^2}} \\left(1 - \\exp\\left(-\\frac{\\theta^2}{2(2+h^2)}\\right)\\right)$. For small $\\theta$, $\\text{MMD}^2(P_0, P_\\theta) \\asymp \\frac{\\theta^2}{2+h^2}$, confirming identifiability exponent $\\beta = 1$ with preconstant depending on kernel bandwidth $h$.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953644.0040922, "updated_at": 1788953770.0119524, "history": [], "notes": [{"at": 1788953770.0119503, "by": "planner", "note": "Added explicit MMD integration results supporting the constant prefactor dependency."}]}, "hypothesis_2": {"id": "hypothesis_2", "type": "hypothesis", "content": "Dimension-Dependent Preconstant Curse: In parametric MMD-ABC, rather than a worse exponent $\\beta$ in the identifiability modulus $\\mathrm{MMD}(P_\\theta, P_0) \\ge c \\|\\theta - \\theta_0\\|^\\beta$, smooth kernels suffer from an exponentially decaying preconstant $c(d) \\propto a^{-d}$ with dimension $d$. For a fixed sample size $n$ or tolerance $\\epsilon$, this decay acts as an effective identifiability loss, requiring the tolerance $\\epsilon$ to scale exponentially with $d$ to maintain a non-vanishing posterior acceptance rate, which degrades the practical ABC contraction rate in high dimensions.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953644.0360005, "updated_at": 1788954762.9372213, "history": [], "notes": [{"at": 1788954073.5754826, "by": "planner", "note": "Confirmed by explicit calculation for the Gaussian location family: the identifiability preconstant c(d) decays exponentially as (1 + 1/(2\nu))^{-(d+2)/4}, driving an exponential dimension curse in the posterior contraction rate."}, {"at": 1788954359.0669403, "by": "planner", "note": "Rigorously confirmed in d dimensions via exact analytical calculation in lemma_3."}, {"at": 1788954762.9372146, "by": "planner", "note": "Confirmed by counterexample flex_6: choosing a dimension-adaptive bandwidth h = Theta(sqrt{d}) prevents the exponential decay of the prefactor (h^2/(h^2+2))^{d/2} -> 0, successfully bypassing the dimension-dependent preconstant curse."}]}, "obstacle_4": {"id": "obstacle_4", "type": "obstacle", "content": "Degeneracy of the ABC Denominator via Spectral Decay: Bounding the ABC posterior denominator from below requires ensuring a non-vanishing prior mass for the acceptance region {\\theta : \\widehat{\\mathrm{MMD}}^2(P_n, P_{\\theta, m}) \\le \\epsilon_n^2}. Taylor-expanding the population MMD around the true parameter \\theta_0 yields \\mathrm{MMD}^2(P_0, P_\\theta) \\approx (\\theta - \\theta_0)^T H(\\theta_0) (\\theta - \\theta_0), where H(\\theta_0) is the Hessian. If the kernel's Mercer eigenvalues decay rapidly, the eigenvalues of H(\\theta_0) decay correspondingly in directions of high-frequency eigenfunctions, making the acceptance region extremely narrow along those dimensions and exponentially shrinking the prior volume of the accepted region.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1788953697.0889103, "updated_at": 1788954587.7353513, "history": [], "notes": [{"at": 1788954330.0240483, "by": "planner", "note": "Confirmed via worker derivation that rapid kernel eigenvalue decay \\lambda_j drives \\lambda_{\\min}(H(\\theta_0)) to zero when parameter variations align with high-frequency eigenfunctions."}, {"at": 1788954556.0871992, "by": "planner", "note": "Counterexamples demonstrate that Taylor expansions and Hessian existence fail for unbounded kernels under heavy-tailed models, reinforcing that kernel boundedness is a prerequisite for local volume shrinkage analysis."}, {"at": 1788954567.7809312, "by": "planner", "note": "Clarified by sketcher: Acceptance region is infinitely flat/wide along high-frequency directions (semi-axis lengths r_k = epsilon / sqrt(nu_k) -> infinity), causing unidentifiability rather than prior volume shrinkage."}]}, "idea_2": {"id": "idea_2", "type": "idea", "content": "RKHS Trace Independence vs. Spectral Decay Curse: Although the total trace of the kernel integral operator \\int k(x,x) dP_0(x) is bounded by \\sup_x k(x,x) independently of the dimension (preserving the O_p(n^{-1/2}) concentration rate of the empirical MMD), the individual eigenvalues decay slower as \\lambda_j \\sim j^{-2s/d}$ in high dimensions d. This slow decay does not degrade empirical convergence but flattens the population MMD profile around \\theta_0, causing a severe parameter sensitivity loss (either an inflated exponent \\beta or a vanishing preconstant c).", "status": "PROMISING", "created_by": "planner", "created_at": 1788953697.0974264, "updated_at": 1788954509.698278, "history": []}, "lemma_2": {"id": "lemma_2", "type": "lemma", "content": "Hoeffding Projection Variance under Spectral Representation: For a kernel with Mercer spectral representation $k(x,y) = \\sum_{j=1}^\\infty \\lambda_j e_j(x) e_j(y)$ with orthonormal eigenfunctions $e_j$ with respect to a reference measure $P_0$, the variance of the first-order projection (Hoeffding projection) of the empirical MMD is given by $\\operatorname{Var}_{X \\sim P_0}(\\mathbb{E}_{Y \\sim P_\\theta}[k(X, Y)]) = \\sum_{j=1}^\\infty \\lambda_j^2 (\\mu_{0, j} - \\mu_{\\theta, j})^2 \\operatorname{Var}(e_j(X))$, where $\\mu_{0, j} = \\mathbb{E}_{X \\sim P_0}[e_j(X)]$ and $\\mu_{\\theta, j} = \\mathbb{E}_{Y \\sim P_\\theta}[e_j(Y)]$. This formula demonstrates that rapid eigenvalue decay suppresses the variance of the empirical MMD estimator by dampening high-frequency components, but simultaneously degrades parameter sensitivity in directions aligned with high-frequency eigenfunctions.", "status": "PROMISING", "created_by": "planner", "created_at": 1788953861.7085626, "updated_at": 1788954684.5321982, "history": [], "notes": [{"at": 1788953992.3043685, "by": "planner", "note": "Confirmed via U-statistic Hoeffding chaos decomposition: first-order projection variance is sum_{j=1}^infty lambda_j^2 (mu_{0,j} - mu_{theta,j})^2 Var(e_j(X))."}]}, "paper_5": {"id": "paper_5", "type": "paper", "content": "Cloninger (2018) 'Bounding the Error From Reference Set Kernel Maximum Mean Discrepancy' (arXiv:1812.04594). Establishes non-asymptotic error bounds for approximating MMD via a subset of R reference points and weights, controlled by the spectral decay of kernel Laplacian eigenfunctions. Suggests that projecting onto low-frequency eigenfunctions captures almost all MMD energy, offering a mechanism to accelerate MMD computation in large-sample or ABC regimes.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1788954231.1022415, "updated_at": 1788954231.1022425, "history": []}, "note_1": {"id": "note_1", "type": "note", "content": "Exact MMD for Gaussian location family P_0 = N(0, I_d) and P_theta = N(theta, I_d) with kernel k(x,y) = exp(-gamma ||x-y||^2): MMD^2(P_0, P_\theta) = 2 (1 + 4\boldsymbol{\beta})^{-d/2} [1 - \text{correction}]$. The preconstant decays as $(1+4\theta)^{-d/2}$ or $(1+4\nu)^{-d/2}$, proving the dimension-dependent preconstant curse.", "status": "PROMISING", "created_by": "planner", "created_at": 1788954307.9663775, "updated_at": 1788954762.9472225, "history": [], "notes": [{"at": 1788954762.947221, "by": "planner", "note": "Exact MMD formula calculation shows kernel bandwidth scaling h = Theta(sqrt{d}) maintains a non-vanishing prefactor asymptotic to e^{-1} in high dimensions."}]}, "lemma_3": {"id": "lemma_3", "type": "lemma", "content": "Volume Shrinkage in High-Dimensional ABC Acceptance Regions: For a Gaussian location family in dimension d with isotropic prior, the parameter acceptance region has a volume scaling as V_d ≈ (2΀e ̄Ε^2 / (d w C_Γ))^{d/2}, leading to an exponentially vanishing prior mass and acceptance probability as d → ∑ unless tolerance scales with dimension.", "status": "PROMISING", "created_by": "planner", "created_at": 1788954433.103537, "updated_at": 1788954433.1035388, "history": []}, "obstacle_5": {"id": "obstacle_5", "type": "obstacle", "content": "Failure and Dimensional Explosion of Naive Spectral Truncation in MMD-ABC: If the true parameter theta_0 or perturbation lies along high-frequency kernel eigenfunctions, fixed-order spectral truncation yields zero signal or a massive truncation error that grows exponentially in dimension d unless truncation level K_n scales exponentially, rendering naive spectral truncation vacuous in high dimensions without smoothness constraints.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1788954456.7586918, "updated_at": 1788954456.758692, "history": []}, "idea_3": {"id": "idea_3", "type": "idea", "content": "Sobolev Norm Constrained Parameter Classes for MMD-ABC: Restricting the parameter-to-distribution mapping via Sobolev norm bounds on the score operator nabla_theta P_theta in terms of the kernel's eigenbasis rules out high-frequency activation, rescuing spectral truncation and small-ball probability bounds in high dimensions.", "status": "IDEA", "created_by": "planner", "created_at": 1788954456.7733686, "updated_at": 1788954456.7733688, "history": []}, "theorem_1": {"id": "theorem_1", "type": "theorem", "content": "Optimal Kernel Smoothness and Minimax Rates in Non-Parametric MMD-ABC: For a parameter theta in a Sobolev ellipsoid of smoothness p, and a kernel with Mercer eigenvalue decay lambda_j ~ j^{-2s/d}, the MMD-ABC posterior contraction rate balances empirical estimation variance and ill-posedness. If s < d/2 (rough kernel), empirical MMD estimation is slow (rate n^{-s/d}), yielding posterior contraction n^{-sp/(d(s+p))}. If s > d/2 (smooth kernel), empirical MMD converges at n^{-1/2}, but high-frequency parameter differences are heavily damped, yielding rate n^{-p/(2(s+p))}. The optimal smoothness is s* = d/2, achieving the minimax non-parametric rate n^{-p/(d+2p)}.", "status": "PROMISING", "created_by": "planner", "created_at": 1788954715.1007464, "updated_at": 1788954715.1007473, "history": []}}, "edges": [{"source": "hypothesis_1", "target": "problem", "relation": "possible_approach"}, {"source": "obstacle_3", "target": "problem", "relation": "blocks"}, {"source": "lemma_1", "target": "obstacle_3", "relation": "related_to"}, {"source": "paper_2", "target": "obstacle_1", "relation": "related_to"}, {"source": "idea_1", "target": "obstacle_1", "relation": "addresses"}, {"source": "idea_1", "target": "lemma_1", "relation": "depends_on"}, {"source": "counterexample_1", "target": "hypothesis_1", "relation": "contradicts"}, {"source": "hypothesis_2", "target": "hypothesis_1", "relation": "derived_from"}, {"source": "hypothesis_2", "target": "problem", "relation": "possible_approach"}, {"source": "lemma_1", "target": "obstacle_4", "relation": "related_to"}, {"source": "obstacle_4", "target": "problem", "relation": "blocks"}, {"source": "idea_2", "target": "lemma_1", "relation": "depends_on"}, {"source": "idea_2", "target": "obstacle_3", "relation": "addresses"}, {"source": "lemma_1", "target": "obstacle_1", "relation": "related_to"}, {"source": "hypothesis_1", "target": "lemma_1", "relation": "depends_on"}, {"source": "counterexample_1", "target": "lemma_1", "relation": "related_to"}, {"source": "hypothesis_2", "target": "obstacle_4", "relation": "addresses"}, {"source": "hypothesis_2", "target": "obstacle_4", "relation": "related_to" <script>
"use strict";

const STATUS_COLOUR = {
  PROMISING: "var(--promising)",
  OBSTACLE: "var(--obstacle)",
  IDEA: "var(--idea)",
  UNVERIFIED: "var(--unverified)",
  POTENTIALLY_RELEVANT: "var(--paper)",
  DEAD_END: "var(--dead)",
  REJECTED: "var(--rejected)",
};
const STATUS_ORDER = Object.keys(STATUS_COLOUR);
const DASHED_RELATIONS = new Set(["contradicts", "blocks"]);
const SVG_NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("canvas");
const viewport = document.getElementById("viewport");
const edgeLayer = document.getElementById("edge-layer");
const nodeLayer = document.getElementById("node-layer");
const feedEl = document.getElementById("feed");
const legendEl = document.getElementById("legend");
const detailEl = document.getElementById("detail");
const statsEl = document.getElementById("stats");
const problemEl = document.getElementById("problem");
const pillEl = document.getElementById("status-pill");

const nodes = new Map();   // id -> {id, data, x, y, vx, vy, pinned, r, g, els}
const edges = new Map();   // key -> {source, target, relation, el}
const hiddenStatuses = new Set();

let view = { x: 0, y: 0, k: 1 };
let running = true;
let eventsTotal = 0;
let pollMs = 1000;
let selected = null;
// The view keeps reframing itself as the graph grows, until you take over by
// panning, zooming or dragging; after that it leaves the camera alone.
let userMoved = false;
let refitTimer = null;
let lastNodeCount = -1;

// ---------------------------------------------------------------- utilities

function el(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

function clip(text, limit) {
  text = (text || "").replace(/\s+/g, " ").trim();
  return text.length <= limit ? text : text.slice(0, limit - 1) + "\u2026";
}

function clock(ts) {
  const d = new Date((ts || 0) * 1000);
  return d.toTimeString().slice(0, 8);
}

function stamp(ts) {
  if (!ts) return "unknown";
  return new Date(ts * 1000).toLocaleTimeString();
}

// ------------------------------------------------------------------ syncing

function sync(payload) {
  problemEl.textContent = payload.problem || "(no problem recorded)";
  problemEl.title = payload.problem || "";

  const incoming = payload.nodes || {};
  const seen = new Set();

  for (const id in incoming) {
    seen.add(id);
    const data = incoming[id];
    let node = nodes.get(id);
    if (!node) {
      node = makeNode(id, data);
      nodes.set(id, node);
    } else {
      const statusChanged = node.data.status !== data.status;
      node.data = data;
      if (statusChanged) flash(node);
    }
    paintNode(node);
  }

  for (const [id, node] of nodes) {
    if (!seen.has(id)) {
      node.els.group.remove();
      nodes.delete(id);
    }
  }

  const liveEdges = new Set();
  for (const edge of payload.edges || []) {
    const key = `${edge.source}|${edge.relation}|${edge.target}`;
    liveEdges.add(key);
    if (edges.has(key)) continue;
    if (!nodes.has(edge.source) || !nodes.has(edge.target)) continue;
    const line = el("line", {
      class: "edge" + (DASHED_RELATIONS.has(edge.relation) ? " dashed" : ""),
      "marker-end": DASHED_RELATIONS.has(edge.relation) ? "url(#arrow-dashed)" : "url(#arrow)",
    });
    const title = el("title", {});
    title.textContent = `${edge.source} --${edge.relation}--> ${edge.target}`;
    line.appendChild(title);
    edgeLayer.appendChild(line);
    edges.set(key, { ...edge, el: line });
  }
  for (const [key, edge] of edges) {
    if (!liveEdges.has(key)) {
      edge.el.remove();
      edges.delete(key);
    }
  }

  recomputeDegrees();
  drawLegend(payload.stats);
  statsEl.textContent =
    `${payload.stats.nodes} nodes, ${payload.stats.edges} edges` +
    (payload.run ? ` \u00b7 ${payload.run}` : "");
  applyFilter();

  if (nodes.size !== lastNodeCount) {
    lastNodeCount = nodes.size;
    scheduleFit(1400);   // after the layout has settled around the new node
  }
}

function scheduleFit(delay) {
  if (userMoved) return;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    if (!userMoved) fit();
  }, delay);
}

function makeNode(id, data) {
  // Start new nodes just off an existing relative, so the layout does not
  // have to drag them across the whole canvas.
  let ox = 0, oy = 0;
  if (nodes.size) {
    const anchor = [...nodes.values()][nodes.size - 1];
    ox = anchor.x;
    oy = anchor.y;
  }
  const angle = Math.random() * Math.PI * 2;
  const node = {
    id,
    data,
    x: id === "problem" ? 0 : ox + Math.cos(angle) * 90,
    y: id === "problem" ? 0 : oy + Math.sin(angle) * 90,
    vx: 0,
    vy: 0,
    pinned: id === "problem",
    g: 0,
    r: 7,
    els: {},
  };

  const group = el("g", { class: id === "problem" ? "node root" : "node" });
  const circle = el("circle", { r: 7 });
  const title = el("title", {});
  const label = el("text", { class: "label", x: 11, y: 3 });
  const snippet = el("text", { class: "snippet", x: 11, y: 14 });
  group.append(circle, title, label, snippet);
  nodeLayer.appendChild(group);
  node.els = { group, circle, title, label, snippet };

  group.addEventListener("pointerdown", (ev) => startDrag(ev, node));
  group.addEventListener("click", (ev) => {
    ev.stopPropagation();
    if (!clickSuppressed) {
      select(node.id);
    }
    clickSuppressed = false;
  });

  flash(node);
  return node;
}

function paintNode(node) {
  const data = node.data;
  node.els.circle.setAttribute("fill", STATUS_COLOUR[data.status] || "var(--unverified)");
  node.els.title.textContent =
    `${data.id} \u00b7 ${data.type} \u00b7 ${data.status} \u00b7 by ${data.created_by}\n\n` +
    clip(data.content, 600);
  node.els.label.textContent = data.id;
  node.els.snippet.textContent = clip(data.content, 46);
}

function flash(node) {
  node.els.group.classList.add("fresh");
  setTimeout(() => node.els.group.classList.remove("fresh"), 2300);
}

function recomputeDegrees() {
  for (const node of nodes.values()) node.g = 0;
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (a) a.g += 1;
    if (b) b.g += 1;
  }
  for (const node of nodes.values()) {
    node.r = node.id === "problem" ? 15 : 6 + 2.6 * Math.sqrt(node.g);
    node.els.circle.setAttribute("r", node.r);
  }
}

// ------------------------------------------------------------------- filter

function applyFilter() {
  for (const node of nodes.values()) {
    const off = hiddenStatuses.has(node.data.status);
    node.els.group.classList.toggle("faded", off);
  }
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    const off =
      (a && hiddenStatuses.has(a.data.status)) || (b && hiddenStatuses.has(b.data.status));
    edge.el.classList.toggle("faded", !!off);
  }
}

function drawLegend(stats) {
  const counts = stats.by_status || {};
  legendEl.replaceChildren();
  for (const status of STATUS_ORDER) {
    const row = document.createElement("div");
    row.className = "legend-row" + (hiddenStatuses.has(status) ? " off" : "");
    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = STATUS_COLOUR[status];
    const name = document.createElement("span");
    name.textContent = status.replace(/_/g, " ").toLowerCase();
    const count = document.createElement("span");
    count.className = "legend-count";
    count.textContent = counts[status] || 0;
    row.append(swatch, name, count);
    row.addEventListener("click", () => {
      if (hiddenStatuses.has(status)) hiddenStatuses.delete(status);
      else hiddenStatuses.add(status);
      row.classList.toggle("off");
      applyFilter();
      syncDeadButton();
    });
    legendEl.appendChild(row);
  }
}

// ------------------------------------------------------------------- detail

function select(id) {
  selected = id;
  for (const node of nodes.values()) {
    node.els.group.classList.toggle("selected", node.id === id);
  }
  renderDetail();
}

function renderDetail() {
  const node = selected ? nodes.get(selected) : null;
  detailEl.replaceChildren();
  const heading = document.createElement("h2");
  heading.textContent = "Node";
  detailEl.appendChild(heading);

  if (!node) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Click a node to read it in full.";
    detailEl.appendChild(empty);
    return;
  }

  const data = node.data;
  const head = document.createElement("div");
  head.className = "head";
  const id = document.createElement("span");
  id.className = "id";
  id.textContent = data.id;
  head.appendChild(id);
  for (const text of [data.type, data.status, `by ${data.created_by}`]) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = text;
    head.appendChild(tag);
  }
  detailEl.appendChild(head);

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = data.content || "(empty)";
  detailEl.appendChild(content);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `created ${stamp(data.created_at)} \u00b7 updated ${stamp(data.updated_at)}`;
  detailEl.appendChild(meta);

  const links = [];
  for (const edge of edges.values()) {
    if (edge.source === data.id) links.push(`${edge.relation} \u2192 ${edge.target}`);
    else if (edge.target === data.id) links.push(`${edge.source} \u2192 ${edge.relation} \u2192 this`);
  }
  addList("Links", links);
  addList(
    "Status history",
    (data.history || []).map((h) => `${h.status_from} \u2192 ${h.status_to} (${h.by})`)
  );
  addList("Notes", (data.notes || []).map((n) => `${n.by}: ${n.note}`));

  function addList(title, items) {
    if (!items.length) return;
    const label = document.createElement("div");
    label.className = "meta";
    label.style.marginTop = "6px";
    label.textContent = title;
    const list = document.createElement("ul");
    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    }
    detailEl.append(label, list);
  }
}

// --------------------------------------------------------------------- feed

function appendEvents(events) {
  for (const event of events) {
    const row = document.createElement("div");
    row.className = `feed-row ${event.event}`;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = clock(event.ts);
    const who = document.createElement("span");
    who.className = `who ${event.source}`;
    who.textContent = event.source;
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = event.headline || event.event;
    row.append(t, who, what);
    feedEl.prepend(row);
  }
  while (feedEl.childElementCount > 300) feedEl.lastElementChild.remove();
}

// ------------------------------------------------------------------- layout

const REPULSION = 9000;
const SPRING = 0.02;
const SPRING_LENGTH = 125;
const CENTRING = 0.0016;
const DAMPING = 0.86;
const MAX_SPEED = 9;

function step() {
  const list = [...nodes.values()];
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j];
      let dx = a.x - b.x;
      let dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) {
        dx = Math.random() - 0.5;
        dy = Math.random() - 0.5;
        d2 = 1;
      }
      if (d2 > 640000) continue;   // far apart: ignore
      const force = REPULSION / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * force;
      const fy = (dy / d) * force;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }

  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (!a || !b) continue;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const force = (d - SPRING_LENGTH) * SPRING;
    const fx = (dx / d) * force;
    const fy = (dy / d) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  }

  for (const node of nodes.values()) {
    if (node.pinned) { node.vx = 0; node.vy = 0; continue; }
    node.vx -= node.x * CENTRING;
    node.vy -= node.y * CENTRING;
    node.vx *= DAMPING;
    node.vy *= DAMPING;
    const speed = Math.hypot(node.vx, node.vy);
    if (speed > MAX_SPEED) {
      node.vx = (node.vx / speed) * MAX_SPEED;
      node.vy = (node.vy / speed) * MAX_SPEED;
    }
    node.x += node.vx;
    node.y += node.vy;
  }
}

function draw() {
  for (const node of nodes.values()) {
    node.els.group.setAttribute("transform", `translate(${node.x.toFixed(1)} ${node.y.toFixed(1)})`);
  }
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (!a || !b) continue;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d;
    const uy = dy / d;
    edge.el.setAttribute("x1", (a.x + ux * (a.r + 1)).toFixed(1));
    edge.el.setAttribute("y1", (a.y + uy * (a.r + 1)).toFixed(1));
    edge.el.setAttribute("x2", (b.x - ux * (b.r + 5)).toFixed(1));
    edge.el.setAttribute("y2", (b.y - uy * (b.r + 5)).toFixed(1));
  }
  // Snippets help while the graph is small; past a couple of dozen nodes they
  // overlap into noise, so only the selected node keeps its own.
  const showSnippets = view.k >= 0.85 && nodes.size <= 18;
  for (const node of nodes.values()) {
    node.els.snippet.style.display = showSnippets || node.id === selected ? "" : "none";
  }
}

function frame() {
  if (running) step();
  draw();
  requestAnimationFrame(frame);
}

function applyView() {
  viewport.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
}

function fit() {
  if (!nodes.size) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const node of nodes.values()) {
    minX = Math.min(minX, node.x - node.r);
    minY = Math.min(minY, node.y - node.r);
    maxX = Math.max(maxX, node.x + node.r + 90);   // labels sit to the right
    maxY = Math.max(maxY, node.y + node.r + 16);
  }
  const rect = svg.getBoundingClientRect();
  const pad = 55;
  const k = Math.min(
    (rect.width - pad * 2) / Math.max(maxX - minX, 1),
    (rect.height - pad * 2) / Math.max(maxY - minY, 1),
    1.6
  );
  view.k = Math.max(k, 0.12);
  view.x = rect.width / 2 - ((minX + maxX) / 2) * view.k;
  view.y = rect.height / 2 - ((minY + maxY) / 2) * view.k;
  applyView();
}

// ---------------------------------------------------------- pointer control

function toWorld(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  return {
    x: (clientX - rect.left - view.x) / view.k,
    y: (clientY - rect.top - view.y) / view.k,
  };
}

let drag = null;
let clickSuppressed = false;

function startDrag(ev, node) {
  ev.preventDefault();
  ev.stopPropagation();
  const world = toWorld(ev.clientX, ev.clientY);
  drag = { node, dx: node.x - world.x, dy: node.y - world.y, moved: false };
  node.pinned = true;
  svg.setPointerCapture(ev.pointerId);
  clickSuppressed = false;
}

let pan = null;

svg.addEventListener("pointerdown", (ev) => {
  if (drag) return;
  pan = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});

svg.addEventListener("pointermove", (ev) => {
  if (drag) {
    const world = toWorld(ev.clientX, ev.clientY);
    drag.node.x = world.x + drag.dx;
    drag.node.y = world.y + drag.dy;
    drag.node.vx = 0;
    drag.node.vy = 0;
    drag.moved = true;
    clickSuppressed = true;
    userMoved = true;
  } else if (pan) {
    view.x = pan.vx + (ev.clientX - pan.x);
    view.y = pan.vy + (ev.clientY - pan.y);
    userMoved = true;
    applyView();
  }
});

function endPointer(ev) {
  if (drag) {
    if (!drag.moved && drag.node.id !== "problem") drag.node.pinned = false;
    drag = null;
    clickSuppressed = false;
  }
  pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const factor = Math.exp(-ev.deltaY * 0.0015);
  const k = Math.min(Math.max(view.k * factor, 0.1), 4);
  view.x = mx - ((mx - view.x) * k) / view.k;
  view.y = my - ((my - view.y) * k) / view.k;
  view.k = k;
  userMoved = true;
  applyView();
}, { passive: false });

svg.addEventListener("click", () => select(null));

// ----------------------------------------------------------------- controls

const btnPause = document.getElementById("btn-pause");
const btnDead = document.getElementById("btn-dead");

btnPause.addEventListener("click", () => {
  running = !running;
  btnPause.textContent = running ? "Pause layout" : "Resume layout";
  btnPause.classList.toggle("on", !running);
});

document.getElementById("btn-fit").addEventListener("click", () => {
  userMoved = false;   // hand the camera back to auto-framing
  fit();
});

const DEAD = ["DEAD_END", "REJECTED"];
btnDead.addEventListener("click", () => {
  const hiding = !DEAD.every((s) => hiddenStatuses.has(s));
  for (const status of DEAD) {
    if (hiding) hiddenStatuses.add(status);
    else hiddenStatuses.delete(status);
  }
  applyFilter();
  drawLegend({ by_status: lastCounts });
  syncDeadButton();
});

function syncDeadButton() {
  const hiding = DEAD.every((s) => hiddenStatuses.has(s));
  btnDead.classList.toggle("on", hiding);
  btnDead.textContent = hiding ? "Show dead ends" : "Hide dead ends";
}

document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const node of nodes.values()) {
    if (node.id !== "problem") node.pinned = false;
  }
});

// ------------------------------------------------------------------ polling

let lastCounts = {};

function setPill(text, cls) {
  pillEl.textContent = text;
  pillEl.className = cls;
}

async function poll() {
  const first = eventsTotal === 0 && nodes.size === 0;
  try {
    const response = await fetch(
      `/api/state?events_from=${eventsTotal}&full=${first ? 1 : 0}`,
      { cache: "no-store" }
    );
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.json();
    if (payload.changed) {
      pollMs = payload.poll_ms || pollMs;
      lastCounts = payload.stats.by_status || {};
      sync(payload);
      appendEvents(payload.events || []);
      eventsTotal = payload.events_total;
      if (selected) renderDetail();
      setPill(payload.finished ? "run finished" : "live", payload.finished ? "done" : "live");
    }
  } catch (err) {
    setPill("no connection", "lost");
  } finally {
    setTimeout(poll, pollMs);
  }
}

window.addEventListener("resize", () => applyView());

applyView();
syncDeadButton();
requestAnimationFrame(frame);

if (window.STATIC_STATE) {
  const payload = window.STATIC_STATE;
  pollMs = 0;
  lastCounts = payload.stats?.by_status || {};
  sync(payload);
  appendEvents(payload.events || []);
  eventsTotal = payload.events_total || (payload.events ? payload.events.length : 0);
  if (selected) renderDetail();
  setPill("run completed (static)", "done");
  setTimeout(() => fit(), 350);
} else {
  poll();
}
</script>
</body>
</html>
