ultinomial parameter space requires solving an algebraic system where the concentration parameter sum and individual parameters are determined by the variances. When the underlying state distribution is highly asymmetric or bimodal, the matched variances can exceed the maximum bounds allowed under the DM model, causing the algebraic inversion to yield invalid negative concentration parameters or force them to zero, resulting in numerical divergence.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894559.4822452, "updated_at": 1787895672.7173157, "history": [], "notes": [{"at": 1787895562.463524, "by": "planner", "note": "Addressed by lemma_28 via constrained quadratic programming projection."}, {"at": 1787895672.7173142, "by": "planner", "note": "Added content detailing likelihood flatness, underflow, and FFT breakdown."}]}, "obstacle_24": {"id": "obstacle_24", "type": "obstacle", "content": "Rigid Variance-Skewness Coupling and Tail Distortion in Dirichlet-Multinomial ADF: The Dirichlet-Multinomial distribution has tightly coupled moments where the marginal skewness and excess kurtosis are rigidly determined by the sum of parameters. In low-population SEIR regimes, the physical process exhibits asymmetric, heavy-tailed transitions (explosive growth vs. sudden stochastic extinction). Forcing moment matching of only the first two moments to a DM distribution severely distorts tail probabilities and underestimates the fade-out probability, causing cumulative systematic bias over recursive filtering steps.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894559.5017216, "updated_at": 1787894559.5017226, "history": []}, "approach_18": {"id": "approach_18", "type": "approach", "content": "Mixture Dirichlet-Multinomial Assumed Density Filtering (MDM-ADF): To resolve the bimodality destruction of standard DM-ADF near the epidemic threshold, the joint state distribution on the simplex is approximated by a two-component mixture of Dirichlet-Multinomial distributions. One component represents the extinction branch (with mass concentrated near I=0) and the other represents the active outbreak. Moment matching and weight updates are performed recursively, leveraging the analytic tractability of individual DM components under binomial observations to maintain computational efficiency.", "status": "PROMISING", "created_by": "planner", "created_at": 1787894559.5183873, "updated_at": 1787894559.518388, "history": []}, "obstacle_25": {"id": "obstacle_25", "type": "obstacle", "content": "Moment Inversion Singularity, Multivariate Inconsistency, and Parameter Realizability Failures in DM-ADF Moment Matching. Inverting the first and second moments of a multivariate distribution to find the parameters of a Dirichlet-Multinomial DM(N, alpha) distribution is ill-posed for arbitrary transition mixtures. The diagonal elements yield category-specific overdispersion ratios s_k = Sigma_kk / (mu_k * (1 - mu_k / N)). In general, these s_k disagree across categories, leading to multivariate inconsistency. Furthermore, if any s_k < 1 (underdispersion) or s_k >= N (maximal dispersion), the implied total concentration alpha_0 becomes negative or non-positive, violating the parameter domain alpha_k > 0. This prevents stable algebraic Assumed Density Filtering.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894578.6066885, "updated_at": 1787894578.6066897, "history": []}, "lemma_26": {"id": "lemma_26", "type": "lemma", "content": "Constrained Kullback-Leibler Projection for Dirichlet-Multinomial ADF Parameter Matching. Instead of direct algebraic inversion of the overdispersion ratios s_k, we can formulate the DM-ADF projection as minimizing the Kullback-Leibler divergence D_KL(P_true || DM(N, alpha)) or a weighted distance between the true moment-matched covariance and the DM covariance structure, subject to the strict positivity constraints alpha_k > 0 and conservation of the mean. This optimization problem is convex and can be solved efficiently or approximated via a regularized projection of the overdispersion ratios s_k to a consensus value s_bar > 1.", "status": "PROMISING", "created_by": "planner", "created_at": 1787894578.6231132, "updated_at": 1787894578.6231136, "history": []}, "lemma_27": {"id": "lemma_27", "type": "lemma", "content": "Dirichlet-Multinomial Moment Inversion and Boundary Continuity in UMRF: Formalizing the algebraic mapping from PGF-derived first and second moments to DM concentration parameters alpha, with explicit extinction boundary checks and atomic mass preservation to prevent artificial epidemic resurrection.", "status": "PROMISING", "created_by": "planner", "created_at": 1787894871.063016, "updated_at": 1787895318.594929, "history": []}, "obstacle_26": {"id": "obstacle_26", "type": "obstacle", "content": "Over-Determination and Bimodality Loss in DM Moment Projections: Empirical covariance matrices from PGFs over-determine the single overdispersion parameter of Dirichlet-Multinomial distributions, leading to consistency failures and forcing artificial unimodality on bimodal epidemic distributions near the threshold.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894871.080234, "updated_at": 1787894871.0802352, "history": []}, "lemma_28": {"id": "lemma_28", "type": "lemma", "content": "Sensitivity ODE Moment Propagation and Adaptive Dyadic Grid Sizing for State-Corrected PGF: By augmenting PGF characteristic ODEs with first- and second-order sensitivity ODEs along the mean trajectory, marginal means and variances mu_E(t), sigma_E^2(t), mu_I(t), sigma_I^2(t) are obtained with O(1) extra cost. Applying the Vysochanskij-Petunin inequality yields rigorous tail bounds, determining adaptive dyadic grid sizes M_E(t), M_I(t) (rounded to powers of 2) for the 2D IFFT without full distribution evaluation, bypassing cubic state-space explosion.", "status": "PROMISING", "created_by": "planner", "created_at": 1787894900.8618712, "updated_at": 1787894900.8618722, "history": []}, "obstacle_27": {"id": "obstacle_27", "type": "obstacle", "content": "Heavy-Right-Tail Aliasing and Dyadic Latency Instability in Adaptive PGF Grids: During rapid epidemic growth (beta_0 > gamma + sigma), branching process offspring distributions exhibit positive skew and heavy right tails, causing Chebyshev/Vysochanskij-Petunin variance bounds to underestimate extreme tail mass and induce wrap-around aliasing in 2D IFFT. Furthermore, discrete power-of-2 jumping in grid sizes triggered by minor variance fluctuations introduces latency jitter in real-time filtering loops.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894900.877574, "updated_at": 1787894900.877575, "history": []}, "lemma_29": {"id": "lemma_29", "type": "lemma", "content": "S-Block Triangular Decomposition of SEIR CTMC Generator Q: While susceptible count S is strictly non-increasing (S -> S-1), exposed E and infectious I counts can vary (E -> I, I -> R). Consequently, Q is block-triangular with respect to S (states grouped by constant S). Within each S-block, transitions between (E,I) form a sparse submatrix, allowing exact forward substitution across S-levels and reducing global exponentiation complexity.", "status": "PROMISING", "created_by": "planner", "created_at": 1787895546.2030594, "updated_at": 1787895546.20306, "history": []}, "lemma_30": {"id": "lemma_30", "type": "lemma", "content": "Topological DAG Uniformization via Cumulative Event Indexing: By ordering state vectors either by susceptible population S (lexicographically descending) or cumulative transition counts k = (k_SE, k_EI, k_IR), the infinitesimal generator Q of the SEIR CTMC is strictly upper-triangular. Jensen's uniformization matrix P_tilde = I + Q/lambda inherits this block upper-triangular DAG structure, allowing powers P_tilde^k v to be evaluated via forward-propagation along topological layers in O(|E|) sparse operations per uniformization step, completely avoiding full Krylov subspace orthogonalization inner products.", "status": "PROMISING", "created_by": "planner", "created_at": 1787895613.8813303, "updated_at": 1787895783.002637, "history": [], "notes": [{"at": 1787895782.9964085, "by": "planner", "note": "Formalized Whiteley & Rimella multinomial moment propagation for DM-ADF."}]}, "obstacle_28": {"id": "obstacle_28", "type": "obstacle", "content": "Non-Linear Transmission Feedback Breaking Strict Triangular Nilpotency in Cumulative Event DAGs: In closed SEIR models, the infection transmission rate beta * S * I / N dynamically depends on the susceptible population S = S_0 - k_SE. Tracking cumulative event vectors (k_SE, k_EI, k_IR) introduces state space growth up to binom(N+3, 3) and breaks time-homogeneity unless S is explicitly included in the state, which re-introduces non-linear feedback loops across state layers during long observation intervals.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787895613.892927, "updated_at": 1787895613.8929276, "history": []}, "obstacle_29": {"id": "obstacle_29", "type": "obstacle", "content": "Likelihood Flatness and Numerical Underflow in OP-RBPF under Low Reporting Rates ($\rho \to 0$): As $\rho \to 0$, the observation likelihood $\text{Bin}(y; W_{t+1}, \rho)$ flattens, causing the Fisher information matrix to vanish and the optimal proposal to decouple from data. Furthermore, sudden observational anomalies ($y > 0$) with tiny $\rho$ cause catastrophic floating-point underflow ($< 10^{-308}$) in linear-space matrix updates, while forcing the recursion into log-space (log-sum-exp) destroys the algebraic structure required for $O(N^3)$ fast convolution algorithms.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787895672.7229662, "updated_at": 1787895672.7229664, "history": []}, "obstacle_30": {"id": "obstacle_30", "type": "obstacle", "content": "Dirichlet-Multinomial Covariance Sign-Constraint and Extinction Bimodality Failure: The Dirichlet-Multinomial distribution DM(N; alpha) strictly enforces negative off-diagonal covariances Cov(X_i, X_j) < 0 due to the simplex sum constraint sum X_k = N. In SEIR models, however, exposed (E) and infectious (I) compartments exhibit positive co-fluctuation across stochastic trajectories. Furthermore, moment-matching mixtures of multinomials to a unimodal DM distribution destroys bimodal extinction probabilities, creating spurious intermediate zombie states.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787895723.7229328, "updated_at": 1787895723.722933, "history": []}}, "edges": [{"source": "paper_1", "target": "problem", "relation": "addresses"}, {"source": "obstacle_2", "target": "problem", "relation": "blocks"}, {"source": "obstacle_1", "target": "approach_2", "relation": "blocks"}, {"source": "lemma_2", "target": "approach_4", "relation": "supports"}, {"source": "obstacle_3", "target": "approach_3", "relation": "blocks"}, {"source": "lemma_4", "target": "approach_5", "relation": "supports"}, {"source": "lemma_5", "target": "approach_5", "relation": "supports"}, {"source": "lemma_5", "target": "lemma_4", "relation": "derived_from"}, {"source": "lemma_6", "target": "approach_2", "relation": "supports"}, {"source": "lemma_6", "target": "obstacle_1", "relation": "addresses"}, {"source": "approach_7", "target": "obstacle_2", "relation": "addresses"}, {"source": "approach_8", "target": "obstacle_1", "relation": "addresses"}, {"source": "approach_8", "target": "approach_2", "relation": "supports"}, {"source": "obstacle_5", "target": "approach_4", "relation": "blocks"}, {"source": "obstacle_5", "target": "lemma_2", "relation": "related_to"}, {"source": "approach_9", "target": "obstacle_1", "relation": "addresses"}, {"source": "approach_9", "target": "problem", "relation": "possible_approach"}, {"source": "lemma_6", "target": "approach_9", "relation": "related_to"}, {"source": "lemma_7", "target": "approach_10", "relation": "supports"}, {"source": " <script>
"use strict";

const STATUS_COLOUR = {
  PROMISING: "var(--promising)",
  OBSTACLE: "var(--obstacle)",
  IDEA: "var(--idea)",
  UNVERIFIED: "var(--unverified)",
  POTENTIALLY_RELEVANT: "var(--paper)",
  DEAD_END: "var(--dead)",
  REJECTED: "var(--rejected)",
};
const STATUS_ORDER = Object.keys(STATUS_COLOUR);
const DASHED_RELATIONS = new Set(["contradicts", "blocks"]);
const SVG_NS = "http://www.w3.org/2000/svg";

const svg = document.getElementById("canvas");
const viewport = document.getElementById("viewport");
const edgeLayer = document.getElementById("edge-layer");
const nodeLayer = document.getElementById("node-layer");
const feedEl = document.getElementById("feed");
const legendEl = document.getElementById("legend");
const detailEl = document.getElementById("detail");
const statsEl = document.getElementById("stats");
const problemEl = document.getElementById("problem");
const pillEl = document.getElementById("status-pill");

const nodes = new Map();   // id -> {id, data, x, y, vx, vy, pinned, r, g, els}
const edges = new Map();   // key -> {source, target, relation, el}
const hiddenStatuses = new Set();

let view = { x: 0, y: 0, k: 1 };
let running = true;
let eventsTotal = 0;
let pollMs = 1000;
let selected = null;
// The view keeps reframing itself as the graph grows, until you take over by
// panning, zooming or dragging; after that it leaves the camera alone.
let userMoved = false;
let refitTimer = null;
let lastNodeCount = -1;

// ---------------------------------------------------------------- utilities

function el(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

function clip(text, limit) {
  text = (text || "").replace(/\s+/g, " ").trim();
  return text.length <= limit ? text : text.slice(0, limit - 1) + "\u2026";
}

function clock(ts) {
  const d = new Date((ts || 0) * 1000);
  return d.toTimeString().slice(0, 8);
}

function stamp(ts) {
  if (!ts) return "unknown";
  return new Date(ts * 1000).toLocaleTimeString();
}

// ------------------------------------------------------------------ syncing

function sync(payload) {
  problemEl.textContent = payload.problem || "(no problem recorded)";
  problemEl.title = payload.problem || "";

  const incoming = payload.nodes || {};
  const seen = new Set();

  for (const id in incoming) {
    seen.add(id);
    const data = incoming[id];
    let node = nodes.get(id);
    if (!node) {
      node = makeNode(id, data);
      nodes.set(id, node);
    } else {
      const statusChanged = node.data.status !== data.status;
      node.data = data;
      if (statusChanged) flash(node);
    }
    paintNode(node);
  }

  for (const [id, node] of nodes) {
    if (!seen.has(id)) {
      node.els.group.remove();
      nodes.delete(id);
    }
  }

  const liveEdges = new Set();
  for (const edge of payload.edges || []) {
    const key = `${edge.source}|${edge.relation}|${edge.target}`;
    liveEdges.add(key);
    if (edges.has(key)) continue;
    if (!nodes.has(edge.source) || !nodes.has(edge.target)) continue;
    const line = el("line", {
      class: "edge" + (DASHED_RELATIONS.has(edge.relation) ? " dashed" : ""),
      "marker-end": DASHED_RELATIONS.has(edge.relation) ? "url(#arrow-dashed)" : "url(#arrow)",
    });
    const title = el("title", {});
    title.textContent = `${edge.source} --${edge.relation}--> ${edge.target}`;
    line.appendChild(title);
    edgeLayer.appendChild(line);
    edges.set(key, { ...edge, el: line });
  }
  for (const [key, edge] of edges) {
    if (!liveEdges.has(key)) {
      edge.el.remove();
      edges.delete(key);
    }
  }

  recomputeDegrees();
  drawLegend(payload.stats);
  statsEl.textContent =
    `${payload.stats.nodes} nodes, ${payload.stats.edges} edges` +
    (payload.run ? ` \u00b7 ${payload.run}` : "");
  applyFilter();

  if (nodes.size !== lastNodeCount) {
    lastNodeCount = nodes.size;
    scheduleFit(1400);   // after the layout has settled around the new node
  }
}

function scheduleFit(delay) {
  if (userMoved) return;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    if (!userMoved) fit();
  }, delay);
}

function makeNode(id, data) {
  // Start new nodes just off an existing relative, so the layout does not
  // have to drag them across the whole canvas.
  let ox = 0, oy = 0;
  if (nodes.size) {
    const anchor = [...nodes.values()][nodes.size - 1];
    ox = anchor.x;
    oy = anchor.y;
  }
  const angle = Math.random() * Math.PI * 2;
  const node = {
    id,
    data,
    x: id === "problem" ? 0 : ox + Math.cos(angle) * 90,
    y: id === "problem" ? 0 : oy + Math.sin(angle) * 90,
    vx: 0,
    vy: 0,
    pinned: id === "problem",
    g: 0,
    r: 7,
    els: {},
  };

  const group = el("g", { class: id === "problem" ? "node root" : "node" });
  const circle = el("circle", { r: 7 });
  const title = el("title", {});
  const label = el("text", { class: "label", x: 11, y: 3 });
  const snippet = el("text", { class: "snippet", x: 11, y: 14 });
  group.append(circle, title, label, snippet);
  nodeLayer.appendChild(group);
  node.els = { group, circle, title, label, snippet };

  group.addEventListener("pointerdown", (ev) => startDrag(ev, node));
  group.addEventListener("click", (ev) => {
    ev.stopPropagation();
    select(node.id);
  });

  flash(node);
  return node;
}

function paintNode(node) {
  const data = node.data;
  node.els.circle.setAttribute("fill", STATUS_COLOUR[data.status] || "var(--unverified)");
  node.els.title.textContent =
    `${data.id} \u00b7 ${data.type} \u00b7 ${data.status} \u00b7 by ${data.created_by}\n\n` +
    clip(data.content, 600);
  node.els.label.textContent = data.id;
  node.els.snippet.textContent = clip(data.content, 46);
}

function flash(node) {
  node.els.group.classList.add("fresh");
  setTimeout(() => node.els.group.classList.remove("fresh"), 2300);
}

function recomputeDegrees() {
  for (const node of nodes.values()) node.g = 0;
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (a) a.g += 1;
    if (b) b.g += 1;
  }
  for (const node of nodes.values()) {
    node.r = node.id === "problem" ? 15 : 6 + 2.6 * Math.sqrt(node.g);
    node.els.circle.setAttribute("r", node.r);
  }
}

// ------------------------------------------------------------------- filter

function applyFilter() {
  for (const node of nodes.values()) {
    const off = hiddenStatuses.has(node.data.status);
    node.els.group.classList.toggle("faded", off);
  }
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    const off =
      (a && hiddenStatuses.has(a.data.status)) || (b && hiddenStatuses.has(b.data.status));
    edge.el.classList.toggle("faded", !!off);
  }
}

function drawLegend(stats) {
  const counts = stats.by_status || {};
  legendEl.replaceChildren();
  for (const status of STATUS_ORDER) {
    const row = document.createElement("div");
    row.className = "legend-row" + (hiddenStatuses.has(status) ? " off" : "");
    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = STATUS_COLOUR[status];
    const name = document.createElement("span");
    name.textContent = status.replace(/_/g, " ").toLowerCase();
    const count = document.createElement("span");
    count.className = "legend-count";
    count.textContent = counts[status] || 0;
    row.append(swatch, name, count);
    row.addEventListener("click", () => {
      if (hiddenStatuses.has(status)) hiddenStatuses.delete(status);
      else hiddenStatuses.add(status);
      row.classList.toggle("off");
      applyFilter();
      syncDeadButton();
    });
    legendEl.appendChild(row);
  }
}

// ------------------------------------------------------------------- detail

function select(id) {
  selected = id;
  for (const node of nodes.values()) {
    node.els.group.classList.toggle("selected", node.id === id);
  }
  renderDetail();
}

function renderDetail() {
  const node = selected ? nodes.get(selected) : null;
  detailEl.replaceChildren();
  const heading = document.createElement("h2");
  heading.textContent = "Node";
  detailEl.appendChild(heading);

  if (!node) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Click a node to read it in full.";
    detailEl.appendChild(empty);
    return;
  }

  const data = node.data;
  const head = document.createElement("div");
  head.className = "head";
  const id = document.createElement("span");
  id.className = "id";
  id.textContent = data.id;
  head.appendChild(id);
  for (const text of [data.type, data.status, `by ${data.created_by}`]) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = text;
    head.appendChild(tag);
  }
  detailEl.appendChild(head);

  const content = document.createElement("div");
  content.className = "content";
  content.textContent = data.content || "(empty)";
  detailEl.appendChild(content);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = `created ${stamp(data.created_at)} \u00b7 updated ${stamp(data.updated_at)}`;
  detailEl.appendChild(meta);

  const links = [];
  for (const edge of edges.values()) {
    if (edge.source === data.id) links.push(`${edge.relation} \u2192 ${edge.target}`);
    else if (edge.target === data.id) links.push(`${edge.source} \u2192 ${edge.relation} \u2192 this`);
  }
  addList("Links", links);
  addList(
    "Status history",
    (data.history || []).map((h) => `${h.status_from} \u2192 ${h.status_to} (${h.by})`)
  );
  addList("Notes", (data.notes || []).map((n) => `${n.by}: ${n.note}`));

  function addList(title, items) {
    if (!items.length) return;
    const label = document.createElement("div");
    label.className = "meta";
    label.style.marginTop = "6px";
    label.textContent = title;
    const list = document.createElement("ul");
    for (const item of items) {
      const li = document.createElement("li");
      li.textContent = item;
      list.appendChild(li);
    }
    detailEl.append(label, list);
  }
}

// --------------------------------------------------------------------- feed

function appendEvents(events) {
  for (const event of events) {
    const row = document.createElement("div");
    row.className = `feed-row ${event.event}`;
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = clock(event.ts);
    const who = document.createElement("span");
    who.className = `who ${event.source}`;
    who.textContent = event.source;
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = event.headline || event.event;
    row.append(t, who, what);
    feedEl.prepend(row);
  }
  while (feedEl.childElementCount > 300) feedEl.lastElementChild.remove();
}

// ------------------------------------------------------------------- layout

const REPULSION = 9000;
const SPRING = 0.02;
const SPRING_LENGTH = 125;
const CENTRING = 0.0016;
const DAMPING = 0.86;
const MAX_SPEED = 9;

function step() {
  const list = [...nodes.values()];
  for (let i = 0; i < list.length; i++) {
    const a = list[i];
    for (let j = i + 1; j < list.length; j++) {
      const b = list[j];
      let dx = a.x - b.x;
      let dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) {
        dx = Math.random() - 0.5;
        dy = Math.random() - 0.5;
        d2 = 1;
      }
      if (d2 > 640000) continue;   // far apart: ignore
      const force = REPULSION / d2;
      const d = Math.sqrt(d2);
      const fx = (dx / d) * force;
      const fy = (dy / d) * force;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
  }

  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (!a || !b) continue;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const force = (d - SPRING_LENGTH) * SPRING;
    const fx = (dx / d) * force;
    const fy = (dy / d) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  }

  for (const node of nodes.values()) {
    if (node.pinned) { node.vx = 0; node.vy = 0; continue; }
    node.vx -= node.x * CENTRING;
    node.vy -= node.y * CENTRING;
    node.vx *= DAMPING;
    node.vy *= DAMPING;
    const speed = Math.hypot(node.vx, node.vy);
    if (speed > MAX_SPEED) {
      node.vx = (node.vx / speed) * MAX_SPEED;
      node.vy = (node.vy / speed) * MAX_SPEED;
    }
    node.x += node.vx;
    node.y += node.vy;
  }
}

function draw() {
  for (const node of nodes.values()) {
    node.els.group.setAttribute("transform", `translate(${node.x.toFixed(1)} ${node.y.toFixed(1)})`);
  }
  for (const edge of edges.values()) {
    const a = nodes.get(edge.source);
    const b = nodes.get(edge.target);
    if (!a || !b) continue;
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const ux = dx / d;
    const uy = dy / d;
    edge.el.setAttribute("x1", (a.x + ux * (a.r + 1)).toFixed(1));
    edge.el.setAttribute("y1", (a.y + uy * (a.r + 1)).toFixed(1));
    edge.el.setAttribute("x2", (b.x - ux * (b.r + 5)).toFixed(1));
    edge.el.setAttribute("y2", (b.y - uy * (b.r + 5)).toFixed(1));
  }
  // Snippets help while the graph is small; past a couple of dozen nodes they
  // overlap into noise, so only the selected node keeps its own.
  const showSnippets = view.k >= 0.85 && nodes.size <= 18;
  for (const node of nodes.values()) {
    node.els.snippet.style.display = showSnippets || node.id === selected ? "" : "none";
  }
}

function frame() {
  if (running) step();
  draw();
  requestAnimationFrame(frame);
}

function applyView() {
  viewport.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);
}

function fit() {
  if (!nodes.size) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const node of nodes.values()) {
    minX = Math.min(minX, node.x - node.r);
    minY = Math.min(minY, node.y - node.r);
    maxX = Math.max(maxX, node.x + node.r + 90);   // labels sit to the right
    maxY = Math.max(maxY, node.y + node.r + 16);
  }
  const rect = svg.getBoundingClientRect();
  const pad = 55;
  const k = Math.min(
    (rect.width - pad * 2) / Math.max(maxX - minX, 1),
    (rect.height - pad * 2) / Math.max(maxY - minY, 1),
    1.6
  );
  view.k = Math.max(k, 0.12);
  view.x = rect.width / 2 - ((minX + maxX) / 2) * view.k;
  view.y = rect.height / 2 - ((minY + maxY) / 2) * view.k;
  applyView();
}

// ---------------------------------------------------------- pointer control

function toWorld(clientX, clientY) {
  const rect = svg.getBoundingClientRect();
  return {
    x: (clientX - rect.left - view.x) / view.k,
    y: (clientY - rect.top - view.y) / view.k,
  };
}

let drag = null;

function startDrag(ev, node) {
  ev.preventDefault();
  ev.stopPropagation();
  const world = toWorld(ev.clientX, ev.clientY);
  drag = { node, dx: node.x - world.x, dy: node.y - world.y, moved: false };
  node.pinned = true;
  svg.setPointerCapture(ev.pointerId);
}

let pan = null;

svg.addEventListener("pointerdown", (ev) => {
  if (drag) return;
  pan = { x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y };
  svg.classList.add("panning");
  svg.setPointerCapture(ev.pointerId);
});

svg.addEventListener("pointermove", (ev) => {
  if (drag) {
    const world = toWorld(ev.clientX, ev.clientY);
    drag.node.x = world.x + drag.dx;
    drag.node.y = world.y + drag.dy;
    drag.node.vx = 0;
    drag.node.vy = 0;
    drag.moved = true;
    userMoved = true;
  } else if (pan) {
    view.x = pan.vx + (ev.clientX - pan.x);
    view.y = pan.vy + (ev.clientY - pan.y);
    userMoved = true;
    applyView();
  }
});

function endPointer(ev) {
  if (drag) {
    if (!drag.moved && drag.node.id !== "problem") drag.node.pinned = false;
    drag = null;
  }
  pan = null;
  svg.classList.remove("panning");
  try { svg.releasePointerCapture(ev.pointerId); } catch (_) {}
}
svg.addEventListener("pointerup", endPointer);
svg.addEventListener("pointercancel", endPointer);

svg.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const rect = svg.getBoundingClientRect();
  const mx = ev.clientX - rect.left;
  const my = ev.clientY - rect.top;
  const factor = Math.exp(-ev.deltaY * 0.0015);
  const k = Math.min(Math.max(view.k * factor, 0.1), 4);
  view.x = mx - ((mx - view.x) * k) / view.k;
  view.y = my - ((my - view.y) * k) / view.k;
  view.k = k;
  userMoved = true;
  applyView();
}, { passive: false });

svg.addEventListener("click", () => select(null));

// ----------------------------------------------------------------- controls

const btnPause = document.getElementById("btn-pause");
const btnDead = document.getElementById("btn-dead");

btnPause.addEventListener("click", () => {
  running = !running;
  btnPause.textContent = running ? "Pause layout" : "Resume layout";
  btnPause.classList.toggle("on", !running);
});

document.getElementById("btn-fit").addEventListener("click", () => {
  userMoved = false;   // hand the camera back to auto-framing
  fit();
});

const DEAD = ["DEAD_END", "REJECTED"];
btnDead.addEventListener("click", () => {
  const hiding = !DEAD.every((s) => hiddenStatuses.has(s));
  for (const status of DEAD) {
    if (hiding) hiddenStatuses.add(status);
    else hiddenStatuses.delete(status);
  }
  applyFilter();
  drawLegend({ by_status: lastCounts });
  syncDeadButton();
});

function syncDeadButton() {
  const hiding = DEAD.every((s) => hiddenStatuses.has(s));
  btnDead.classList.toggle("on", hiding);
  btnDead.textContent = hiding ? "Show dead ends" : "Hide dead ends";
}

document.getElementById("btn-unpin").addEventListener("click", () => {
  for (const node of nodes.values()) {
    if (node.id !== "problem") node.pinned = false;
  }
});

// ------------------------------------------------------------------ polling

let lastCounts = {};

function setPill(text, cls) {
  pillEl.textContent = text;
  pillEl.className = cls;
}

async function poll() {
  const first = eventsTotal === 0 && nodes.size === 0;
  try {
    const response = await fetch(
      `/api/state?events_from=${eventsTotal}&full=${first ? 1 : 0}`,
      { cache: "no-store" }
    );
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const payload = await response.json();
    if (payload.changed) {
      pollMs = payload.poll_ms || pollMs;
      lastCounts = payload.stats.by_status || {};
      sync(payload);
      appendEvents(payload.events || []);
      eventsTotal = payload.events_total;
      if (selected) renderDetail();
      setPill(payload.finished ? "run finished" : "live", payload.finished ? "done" : "live");
    }
  } catch (err) {
    setPill("no connection", "lost");
  } finally {
    setTimeout(poll, pollMs);
  }
}

window.addEventListener("resize", () => applyView());

applyView();
syncDeadButton();
requestAnimationFrame(frame);

if (window.STATIC_STATE) {
  const payload = window.STATIC_STATE;
  pollMs = 0;
  lastCounts = payload.stats?.by_status || {};
  sync(payload);
  appendEvents(payload.events || []);
  eventsTotal = payload.events_total || (payload.events ? payload.events.length : 0);
  if (selected) renderDetail();
  setPill("run completed (static)", "done");
  setTimeout(() => fit(), 350);
} else {
  poll();
}
</script>
</body>
