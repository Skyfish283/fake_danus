<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Research graph</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #141a22;
    --panel-2: #1b232d;
    --line: #263140;
    --text: #d8e0ea;
    --muted: #7d8b9c;
    --promising: #34d399;
    --obstacle: #fbbf24;
    --idea: #60a5fa;
    --unverified: #93a3b6;
    --paper: #c084fc;
    --dead: #566070;
    --rejected: #ef7c7c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex: none;
  }
  header h1 { font-size: 13px; font-weight: 600; margin: 0; white-space: nowrap; }
  #problem {
    color: var(--muted);
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #stats { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #status-pill {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    white-space: nowrap;
    border: 1px solid var(--line);
    color: var(--muted);
  }
  #status-pill.live { color: var(--promising); border-color: #245c46; }
  #status-pill.done { color: var(--idea); border-color: #23415e; }
  #status-pill.lost { color: var(--rejected); border-color: #5e2a2a; }

  main { flex: 1; display: flex; min-height: 0; }

  #canvas-wrap { position: relative; flex: 1; min-width: 0; }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.panning { cursor: grabbing; }

  #toolbar {
    position: absolute;
    top: 10px;
    left: 10px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 4px 9px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { border-color: #3a4a5e; }
  button.on { color: #0d1117; background: var(--idea); border-color: var(--idea); }

  aside {
    width: 380px;
    flex: none;
    border-left: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  aside section { border-bottom: 1px solid var(--line); padding: 10px 12px; }
  aside h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }

  #legend { display: flex; flex-direction: column; gap: 3px; }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    user-select: none;
  }
  .legend-row:hover { background: var(--panel-2); }
  .legend-row.off { opacity: 0.35; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .legend-row span:nth-child(2) { flex: 1; }
  .legend-count { color: var(--muted); font-variant-numeric: tabular-nums; }

  #detail { flex: none; max-height: 42%; overflow: auto; }
  #detail .empty { color: var(--muted); }
  #detail .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  #detail .id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    color: var(--muted);
    white-space: nowrap;
  }
  #detail .content { white-space: pre-wrap; word-break: break-word; margin: 6px 0; }
  #detail .meta { color: var(--muted); font-size: 12px; }
  #detail ul { margin: 4px 0 0; padding-left: 18px; color: var(--muted); font-size: 12px; }

  #feed-section { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 0; }
  #feed { overflow: auto; flex: 1; font-size: 12px; }
  .feed-row { display: flex; gap: 7px; padding: 2px 0; border-bottom: 1px solid #1b2229; }
  .feed-row .t { color: #55616f; font-variant-numeric: tabular-nums; flex: none; }
  .feed-row .who { flex: none; width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-row .what { flex: 1; color: var(--muted); word-break: break-word; }
  .who.planner { color: #67e8f9; }
  .who.explorer { color: var(--promising); }
  .who.mathematician { color: var(--obstacle); }
  .who.skeptic { color: var(--paper); }
  .who.literature { color: var(--idea); }
  .feed-row.task_failed .what { color: var(--rejected); }

  /* graph */
  .edge { stroke: #3a4757; stroke-width: 1.2; fill: none; }
  .edge.dashed { stroke-dasharray: 5 4; stroke: #7a5a5a; }
  .edge.faded { opacity: 0.07; }
  .node circle { stroke: #0d1117; stroke-width: 1.5; cursor: pointer; }
  .node.root circle { stroke: #8b97a6; stroke-width: 2.5; }
  .node.selected circle { stroke: #ffffff; stroke-width: 2.5; }
  .node.faded { opacity: 0.07; pointer-events: none; }
  .node text {
    fill: var(--text);
    font-size: 10px;
    pointer-events: none;
    paint-order: stroke;
    stroke: #0d1117;
    stroke-width: 3px;
    stroke-linejoin: round;
  }
  .node .snippet { fill: var(--muted); }
  .node.fresh circle { animation: pulse 2.2s ease-out; }
  @keyframes pulse {
    0%   { stroke: #ffffff; stroke-width: 12; }
    100% { stroke: #0d1117; stroke-width: 1.5; }
  }
</style>
</head>
<body>

<header>
  <h1>Research graph</h1>
  <div id="problem">waiting for the run...</div>
  <div id="stats"></div>
  <div id="status-pill">connecting</div>
</header>

<main>
  <div id="canvas-wrap">
    <svg id="canvas">
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 7 4 L 0 7 z" fill="#3a4757"></path>
        </marker>
        <marker id="arrow-dashed" viewBox="0 0 8 8" refX="7" refY="4"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 1 L 7 4 L 0 7 z" fill="#7a5a5a"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edge-layer"></g>
        <g id="node-layer"></g>
      </g>
    </svg>
    <div id="toolbar">
      <button id="btn-pause">Pause layout</button>
      <button id="btn-fit">Fit</button>
      <button id="btn-dead">Hide dead ends</button>
      <button id="btn-unpin">Release pinned</button>
    </div>
  </div>

  <aside>
    <section>
      <h2>Status</h2>
      <div id="legend"></div>
    </section>
    <section id="detail">
      <h2>Node</h2>
      <div class="empty">Click a node to read it in full.</div>
    </section>
    <section id="feed-section">
      <h2>Activity</h2>
      <div id="feed"></div>
    </section>
  </aside>
</main>

<script>
window.STATIC_STATE = {"changed": true, "run": "20260828-132110", "run_dir": "runs\\20260828-132110", "problem": "Consider a branching process representation of an SEIR model. What are some possible ways to approximating the model for low population counts, in the context of partially observed branching processes to use in Bayesian filtering? Consider models such as multinomial models, HMMs, multivariate Poisson. \n\nAn example of a methodology for non small population counts is this paper, which is summarised. This can be inspiration for you. \n\nThis paper develops a Gaussian approximation for the transition function of continuous-time multitype branching processes, enabling fast Bayesian inference via Kalman filtering with computational cost independent of population size. The authors also propose a hybrid method that switches between a particle filter (for small populations) and the Gaussian approximation (for large populations) to balance accuracy and efficiency. The methods are validated on SEIR and SE8I8R epidemic models and applied to COVID-19 data from Victoria, Australia, demonstrating orders-of-magnitude speedups over standard particle filter approaches with minimal bias in posterior distributions when populations are sufficiently large.", "nodes": {"problem": {"id": "problem", "type": "problem", "content": "Consider a branching process representation of an SEIR model. What are some possible ways to approximating the model for low population counts, in the context of partially observed branching processes to use in Bayesian filtering? Consider models such as multinomial models, HMMs, multivariate Poisson. \n\nAn example of a methodology for non small population counts is this paper, which is summarised. This can be inspiration for you. \n\nThis paper develops a Gaussian approximation for the transition function of continuous-time multitype branching processes, enabling fast Bayesian inference via Kalman filtering with computational cost independent of population size. The authors also propose a hybrid method that switches between a particle filter (for small populations) and the Gaussian approximation (for large populations) to balance accuracy and efficiency. The methods are validated on SEIR and SE8I8R epidemic models and applied to COVID-19 data from Victoria, Australia, demonstrating orders-of-magnitude speedups over standard particle filter approaches with minimal bias in posterior distributions when populations are sufficiently large.", "status": "UNVERIFIED", "created_by": "user", "created_at": 1787487398.0907118, "updated_at": 1787487398.0907123, "history": []}, "approach_1": {"id": "approach_1", "type": "approach", "content": "Multinomial and Dirichlet-Multinomial approximations for discrete time steps of low-population SEIR multitype branching processes, using multinomial transitions conditioned on current state counts.", "status": "IDEA", "created_by": "planner", "created_at": 1787487435.0517535, "updated_at": 1787488471.7790613, "history": [], "notes": [{"at": 1787488471.7790596, "by": "planner", "note": "A major breakthrough has been made: under partial Binomial reporting, the posterior under a Dirichlet-Multinomial prior collapses to a 1D scalar sum instead of a 3D simplex sum, making Assumed Density Filtering (ADF) computationally tractable."}]}, "approach_2": {"id": "approach_2", "type": "approach", "content": "Finite-State Hidden Markov Model (HMM) and Chemical Master Equation (CME) state space truncation (such as Finite State Projection) for continuous-time low-population SEIR models, enabling exact forward filtering.", "status": "IDEA", "created_by": "planner", "created_at": 1787487435.0574374, "updated_at": 1787487740.5859585, "history": [], "notes": [{"at": 1787487599.898983, "by": "planner", "note": "Exact state-space size scales as O(N^3), reaching 23,426 states at N=50 and 176,851 at N=100. Truncation (FSP) or dynamic bounding is strictly necessary for N >= 50."}]}, "approach_3": {"id": "approach_3", "type": "approach", "content": "Multivariate Poisson processes, Poisson thinning representations, and Hawkes process formulations for continuous-time multitype SEIR branching processes under partial observations.", "status": "IDEA", "created_by": "planner", "created_at": 1787487435.0604, "updated_at": 1787488940.805899, "history": []}, "approach_4": {"id": "approach_4", "type": "approach", "content": "Rao-Blackwellized Particle Filtering (RBPF) and hybrid discrete-grid/particle filters tailored for low to moderate population counts where specific components can be integrated out analytically.", "status": "IDEA", "created_by": "planner", "created_at": 1787487435.0632284, "updated_at": 1787488453.972394, "history": [], "notes": [{"at": 1787487706.1932049, "by": "planner", "note": "RBPF is supported by exact binomial thinning marginalization of observation likelihoods Y_{k+1} | I_k."}]}, "paper_1": {"id": "paper_1", "type": "paper", "content": "Morsomme & Xu (2022) 'Exact Inference for Stochastic Epidemic Models via Uniformly Ergodic Block Sampling': Proposes a surrogate process data-augmented MCMC filter/inference framework for discretely observed stochastic epidemic models (SIR/SEIR), allowing exact latent trajectory proposals.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1787487455.16234, "updated_at": 1787487455.1623402, "history": []}, "lemma_1": {"id": "lemma_1", "type": "lemma", "content": "Explicit Discrete-Time Binomial/Multinomial Dynamics for SEIR Branching Processes: New exposures U_{t+1} ~ Bin(S_t, 1 - exp(-\\beta I_t \\Delta t / N)), new infectious V_{t+1} ~ Bin(E_t, 1 - exp(-\\sigma \\Delta t)), new recoveries W_{t+1} ~ Bin(I_t, 1 - exp(-\\gamma \\Delta t)). Under partial observation models Y_t ~ Bin(W_{t+1}, \\rho), exact Bayesian filtering updates are analytically computable over small discrete lattice state spaces.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487479.7689087, "updated_at": 1787488118.289929, "history": [], "notes": [{"at": 1787488020.6539714, "by": "planner", "note": "Skeptic evaluation proved O(\\Delta t^2) discretization hazard bias and failure to capture within-interval secondary infections during epidemic growth phases."}, {"at": 1787488118.2899277, "by": "planner", "note": "Mathematician derived the conditional expectations of the binomial/multinomial transition steps: E[S_{t+1}|X_t] = S_t(1 - p_E(I_t)), E[E_{t+1}|X_t] = E_t(1 - p_I) + S_t p_E(I_t), and E[I_{t+1}|X_t] = I_t(1 - p_R) + E_t p_I. While these first-order conditional moments are mathematically simple, the joint distribution of transition events involves convolving multiple independent binomial and multinomial variables, which becomes computationally expensive without further approximation."}]}, "approach_5": {"id": "approach_5", "type": "approach", "content": "Piecewise Decoupled Multitype Branching Process (PD-MBP) Surrogate: Decouples nonlinear SEIR transmission rates into constant-rate multitype branching or linear death processes over discrete observation intervals (t_{k-1}, t_k]. Over each interval, transition events (S -> E -> I -> R) are generated independently as order statistics from truncated exponential/gamma/Weibull distributions, enabling exact block Metropolis-Hastings filtering/smoothing with uniform ergodicity for small to moderate populations.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487546.1979883, "updated_at": 1787488735.129861, "history": [], "notes": [{"at": 1787488735.129859, "by": "planner", "note": "Confirmed by skeptic critique to suffer from a fatal zero-likelihood trap when I_t = 0 and E_t > 0, alongside severe discretization hazard bias, rendering pure PD-MBP unusable for Bayesian filtering near extinction."}]}, "obstacle_1": {"id": "obstacle_1", "type": "obstacle", "content": "Cubic State-Space Explosion in Exact HMM / CME Filtering for Closed SEIR: For population size N, the exact discrete SEIR state space has size |S| = (N+3)(N+2)(N+1)/6 = O(N^3). Dense transition matrix updates require O(N^6) operations and sparse representations require O(N^3) state updates per filter step, creating severe computational and memory barriers for exact HMM filtering when N >= 50 (|S| = 23,426).", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787487599.6855078, "updated_at": 1787488252.3316665, "history": [], "notes": [{"at": 1787488252.331666, "by": "planner", "note": "Krylov subspace projection methods reduce transition complexity from O(|S|^2) or dense O(|S|^3) matrix exponentials to O(m |S|) sparse matrix-vector multiplications, bypassing the dense storage and computation barrier for populations N <= 50."}]}, "obstacle_2": {"id": "obstacle_2", "type": "obstacle", "content": "Boundary Breakdown of Gaussian / Linear Noise Approximations in Low-Population SEIR: Near extinction boundaries (I(t) -> 0), Kurtz's Density Limit Theorem hypotheses fail due to boundary effects and density dependence. Gaussian LNA yields non-zero probability of negative populations and fails to model discrete absorption or extinction probabilities, rendering standard Kalman filters invalid for small N.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787487632.550599, "updated_at": 1787487632.5505993, "history": []}, "approach_6": {"id": "approach_6", "type": "approach", "content": "Factorial Moment Duality for Low-Population SEIR Jump Processes: Duality via factorial moment kernels H(x, y) = prod_k binom(x_k, y_k) maps the nonlinear SEIR jump process X(t) = (E(t), I(t)) to a dual process Y(t) on dual degree space. For low population counts or low-order moment tracking, transition expectations P_t H(x, y) = H(x, P_Y^t y) can be evaluated on a dramatically smaller dual state space, enabling exact moment-based Bayesian filtering without propagating the full O(N^3) state distribution.", "status": "IDEA", "created_by": "planner", "created_at": 1787487658.610933, "updated_at": 1787488669.7222364, "history": []}, "lemma_2": {"id": "lemma_2", "type": "lemma", "content": "Binomial Thinning Marginalization for Partial SEIR Observations: If observation Y_{k+1} ~ Bin(W_{k+1}, \\rho) where W_{k+1} ~ Bin(I_k, 1 - exp(-\\gamma \\Delta t)) is the true recovery count, then Y_{k+1} | I_k ~ Bin(I_k, \\rho (1 - exp(-\\gamma \\Delta t))). In Rao-Blackwellized Particle Filtering (RBPF), conditionally on the nonlinear exposure process S_k, latent stages E_k and I_k progress as linear multitype decay processes with analytically computable conditional expectations and observation likelihoods.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487698.5172105, "updated_at": 1787487785.06763, "history": [], "notes": [{"at": 1787487785.0676286, "by": "planner", "note": "Verifier detected a GAP in Poisson conjugate continuous-time updates: exact Poisson thinning requires unbounded initial populations; closed SEIR models with fixed N require Binomial conditional updates instead."}]}, "lemma_3": {"id": "lemma_3", "type": "lemma", "content": "Exponentially Tilted Dirichlet-Multinomial Posterior under Binomial Observations: For discrete-time SEIR branching process models constrained to total population N, placing a Dirichlet-Multinomial DM(N, alpha) prior over state counts X_t = (S_t, E_t, I_t, R_t) combined with a Binomial reporting observation Y_t ~ Binomial(I_t, rho) yields an exact exponentially tilted Dirichlet-Multinomial posterior distribution p(X_t | Y_t) proportional to Binomial(Y_t; I_t, rho) DM(X_t; N, alpha). This provides a tractable parametric update family for low-population discrete filtering on the simplex.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487760.5189536, "updated_at": 1787488620.17255, "history": []}, "obstacle_3": {"id": "obstacle_3", "type": "obstacle", "content": "Breakdown of Exact Poisson-Binomial Conjugacy in Closed SEIR Models: Unbounded multitype branching process Poisson thinning assumes independent transitions without total population conservation. In closed SEIR populations with constraint S_t + E_t + I_t + R_t = N, finite population limits and nonlinear infection intensity beta * S * I / N invalidate exact Poisson conjugate filtering, necessitating discrete Binomial/Multinomial accounting or conditional particle filtering.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787487784.9069643, "updated_at": 1787487801.0999675, "history": [], "notes": [{"at": 1787487801.099965, "by": "planner", "note": "Skeptic analysis confirmed physical bound violations: Poisson transitions allow non-zero probability for generation of new exposures exceeding available susceptible count (U_{t+1} > S_t) in low populations (e.g., N=10), creating a severe support mismatch and violating population conservation limits."}]}, "lemma_4": {"id": "lemma_4", "type": "lemma", "content": "Piecewise Decoupled Multitype Branching Process (PD-MBP) Transition Probabilities for SEIR: Over observation block T_k = (t_{k-1}, t_k], freezing per-capita hazard h_k = \\beta I_k^* / N decouples the non-linear continuous-time SEIR system into independent continuous-time Markov chains S -> E -> I -> R with linear multi-stage transition rates h_k, \\sigma, \\gamma. Explicit single-individual transition probabilities P_{ij}(\\Delta t) for i, j in {S, E, I, R} are analytically derived via convolution of exponential holding times, enabling exact block Metropolis-Hastings proposals and trajectory updates for low to moderate populations.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487832.6961477, "updated_at": 1787487832.6961482, "history": []}, "lemma_5": {"id": "lemma_5", "type": "lemma", "content": "Explicit Closed-Form Single-Individual Transition Matrix for Piecewise-Linear SEIR Branching Process: Given constant per-capita hazard rate h = beta * I^* / N over interval dt, single-individual transition probabilities p_{ij}(dt) are analytically computable in closed form: p_{SS}(dt) = exp(-h dt), p_{SE}(dt) = h/(sigma - h)*(exp(-h dt) - exp(-sigma dt)), p_{EI}(dt) = sigma/(gamma - sigma)*(exp(-sigma dt) - exp(-gamma dt)), p_{II}(dt) = exp(-gamma dt). Transitions from compartment i follow independent Multinomial(X_i, p_{i*}(dt)) distributions, defining an exact discrete transition convolution operator.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487853.8266437, "updated_at": 1787894039.9786026, "history": [], "notes": [{"at": 1787894039.9786003, "by": "planner", "note": "Verified by flex_1: The single-individual transition probabilities satisfy the Kolmogorov differential equations and are algebraically consistent. The limit as h approaches the transition rate sigma correctly yields dt * exp(-sigma * dt) via L'Hopital's rule."}]}, "lemma_6": {"id": "lemma_6", "type": "lemma", "content": "PGF ODE System and Truncated Matrix Exponential for Low-Population SEIR: For linearized baseline transmission rate beta_0 = beta S / N, the PGF system du_1/dt = sigma(u_2 - u_1), du_2/dt = beta_0 u_1 u_2 + gamma - (beta_0 + gamma)u_2 yields recursive ODEs for transition probabilities P((E_{t+dt}, I_{t+dt}) = (e', i') | (E_t, I_t) = (e, i)). On truncated state spaces K = E+I <= 30, direct evaluation via matrix exponential exp(Q dt) allows accurate forward HMM updates with O(K^3) computational complexity.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487898.8844166, "updated_at": 1787487898.8844166, "history": []}, "approach_7": {"id": "approach_7", "type": "approach", "content": "Hybrid Adaptive Model-Switching Filter (Discrete Branching / RBPF <-> Continuous Gaussian LNA): Combines exact low-population discrete-state approximations (PD-MBP / RBPF) near extinction boundaries with continuous Gaussian Linear Noise Approximation (LNA) Kalman filtering when compartment counts exceed critical thresholds, preventing boundary breakdown while maintaining scalable inference.", "status": "PROMISING", "created_by": "planner", "created_at": 1787487899.3384993, "updated_at": 1787889317.9766273, "history": []}, "obstacle_4": {"id": "obstacle_4", "type": "obstacle", "content": "Discretization Hazard Bias and Within-Interval Secondary Infection Deficit in Discrete Binomial SEIR: Freezing transmission hazard over interval \\Delta t in discrete-time Binomial models introduces an O(\\Delta t^2) first-moment bias. During growth phases (\\sigma E_t > \\gamma I_t), latent individuals progressing E -> I within [t, t+\\Delta t] generate secondary infections that are missed, causing systematic underestimation of transmission unless \\Delta t \\ll \\min(1/\\sigma, N/(\\beta I_t)).", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488020.6410193, "updated_at": 1787488020.6410193, "history": []}, "approach_8": {"id": "approach_8", "type": "approach", "content": "Dynamic Finite State Projection (FSP) with Adaptive State-Space Truncation: Maintains a time-varying active subset of states \\Omega(t) = \\{x : p_x(t) > \\delta\\}. During prediction, \\Omega(t)$ is dynamically expanded by tracing transition paths out of the current set to bound the total outflow intensity \\sum_{u \\in \\Omega(t), v \\notin \\Omega(t)} q_{uv} p_u(t) < \\epsilon. Post-observation, states with posterior probability below \\delta are pruned, restricting the active state space size from O(N^3) to a local neighborhood around the probability mass.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488085.7066703, "updated_at": 1787488873.3627918, "history": [], "notes": [{"at": 1787488686.8181758, "by": "planner", "note": "Encountered severe theoretical and computational obstacles including black swan observation collapse, likelihood bias from sub-stochastic truncation, and dynamic re-indexing overhead compared to static Krylov methods."}]}, "paper_2": {"id": "paper_2", "type": "paper", "content": "Vieille, B. (2024) 'Characterization of the distribution of marked self-exciting Hawkes and Markov point processes'. The thesis derives multi-temporal Laplace transforms and moment equations for Hawkes and Markovian point processes, which are highly relevant for tracking low-population epidemic event histories.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1787488101.0971806, "updated_at": 1787488101.0971806, "history": []}, "obstacle_5": {"id": "obstacle_5", "type": "obstacle", "content": "Weight Collapse and Proposal-Likelihood Mismatch in SEIR Rao-Blackwellized Particle Filtering: In RBPF for low-population SEIR models, when the reporting rate \\rho is small or there is a sudden burst of infections, sampling S_{t+1} from the transition prior leads to a massive mismatch with the observation likelihood. This causes particle weight collapse (where all weights drop to zero simultaneously) and severe sample impoverishment, rendering the filter unstable.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488132.089875, "updated_at": 1787488178.1126506, "history": [], "notes": [{"at": 1787488178.1126497, "by": "planner", "note": "We can resolve this weight collapse obstacle by exploiting the small state space of S to evaluate the marginal likelihood for all possible S_{t+1} values, enabling exact sampling from the optimal proposal."}]}, "approach_9": {"id": "approach_9", "type": "approach", "content": "PGF Characteristic-ODE and FFT-based Coefficient Extraction for Low-Population Filtering: Under a localized multitype branching approximation for the infected classes (E, I) with S approx N, the joint probability generating function G(z_E, z_I, t) satisfies a backward PDE. By solving the characteristic ODEs du_E/dt = \\sigma (u_I - u_E), du_I/dt = \\beta_0 u_E u_I - (\\beta_0 + \\gamma) u_I + \\gamma with initial conditions u_E(0) = z_E, u_I(0) = z_I, we get the individual PGFs u_E(t), u_I(t). For any initial state (E_0, I_0), the joint PGF at time t is G(z_E, z_I, t) = [u_E(t)]^{E_0} [u_I(t)]^{I_0}. The exact transition probabilities P((E_t, I_t) = (e, i) | (E_0, I_0) = (E_0, I_0)) are the Taylor coefficients of G(z_E, z_I, t) at (0,0). By evaluating G on a 2D grid of complex values on the unit circle (z_E, z_I) = (exp(2\\pi i k / M_E), exp(2\\pi i l / M_I)) and applying a 2D Inverse Fast Fourier Transform (2D IFFT), we can extract the complete joint transition probability distribution up to truncation limits M_E, M_I in O(M_E M_I \\log(M_E M_I)) operations, bypassing state-space matrix exponentials entirely.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488153.122799, "updated_at": 1787488768.1978815, "history": [], "notes": [{"at": 1787488212.6305766, "by": "planner", "note": "Worker flex_3 confirmed that the joint transition probability matrix under the branching approximation can be factored as [G_E]^e * [G_I]^i, facilitating rapid multidimensional FFT extraction of transition tensors."}, {"at": 1787488768.1978784, "by": "planner", "note": "Confirmed that unit-circle evaluation avoids real-argument MGF blow-up, though numerical stiffness necessitates high-order adaptive integration."}]}, "lemma_7": {"id": "lemma_7", "type": "lemma", "content": "Exact Latent Joint Matrix Recursion for SEIR RBPF: Let M_t(e, i) = P(E_t = e, I_t = i | S_{0:t}, Y_{1:t}) be the conditional joint PMF of the latent stages, represented as a matrix of size at most (N+1)x(N+1). Given a proposed S_{t+1}, which defines the new exposures U_{t+1} = S_t - S_{t+1}, the joint transition and observation probability is given by summing over the previous latent states: P(S_{t+1}, E_{t+1}=e', I_{t+1}=i', Y_{t+1}=y | S_{0:t}, Y_{1:t}) = \\sum_{e, i} M_t(e, i) * Bin(U_{t+1}; S_t, p_{SE}(i)) * Bin(V_{t+1}; e, p_{EI}) * Bin(W_{t+1}; i, p_{IR}) * Bin(y; W_{t+1}, \\rho), where V_{t+1} = e + U_{t+1} - e', W_{t+1} = i + V_{t+1} - i', p_{SE}(i) = 1 - exp(-\\beta i \\Delta t / N), p_{EI} = 1 - exp(-\\sigma \\Delta t), and p_{IR} = 1 - exp(-\\gamma \\Delta t). The marginal likelihood alpha_{t+1}(S_{t+1}) is the sum of this expression over all (e', i'), and the updated latent matrix is M_{t+1}(e', i') = P(S_{t+1}, e', i', y | S_{0:t}, Y_{1:t}) / alpha_{t+1}(S_{t+1}).", "status": "PROMISING", "created_by": "planner", "created_at": 1787488175.8420694, "updated_at": 1787895520.1709855, "history": [], "notes": [{"at": 1787488787.4124649, "by": "planner", "note": "Verified by verifier (task_72): exact latent joint matrix recursion and compartment conservation equations hold."}, {"at": 1787488850.5964434, "by": "planner", "note": "Verified by verifier flex_1: the conditional joint PMF update step and transition probabilities are mathematically rigorous and consistent with SEIR conservation laws."}, {"at": 1787894039.994326, "by": "planner", "note": "Verified by flex_1: The independent Binomial convolutions are mathematically correct under the frozen hazard approximation, but fail to account for susceptible depletion within the interval dt in closed populations."}, {"at": 1787895520.170984, "by": "planner", "note": "Skeptic critique: Independent binomial factorization over Delta t causes artificial intra-interval trapping (zero intra-interval cascades S->E->I) and systematic underestimation of rapid epidemic growth."}]}, "approach_10": {"id": "approach_10", "type": "approach", "content": "Optimal Proposal Rao-Blackwellized Particle Filter (OP-RBPF) for Low Populations: Because the state space of S_{t+1} is discrete and small (at most S_t + 1 <= N + 1), we can compute the marginal likelihood alpha_{t+1}(s) for every possible value s in {0, ..., S_t} using the joint matrix recursion. The optimal proposal distribution for S_{t+1} is then exactly P(S_{t+1} = s | S_{0:t}, Y_{1:t+1}) = alpha_{t+1}(s) / \\sum_{k=0}^{S_t} alpha_{t+1}(k). Sampling S_{t+1} from this exact discrete distribution completely eliminates proposal-likelihood mismatch and weight collapse (obstacle_5), providing a stable filter with computational cost O(N^4) per time step (or O(N^3) with fast convolution) which is extremely efficient for N <= 50.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488176.1904845, "updated_at": 1787889461.3229532, "history": [], "notes": [{"at": 1787488828.9422743, "by": "planner", "note": "Supported by exact joint matrix recursion; completely eliminates weight collapse for N <= 50 with efficient O(N^4) or O(N^3) complexity."}, {"at": 1787488843.9678504, "by": "planner", "note": "Transition step complexity successfully reduced to O(N^3) via factored intermediate convolutions."}, {"at": 1787488850.779908, "by": "planner", "note": "Backed by verified exact latent joint matrix recursion (lemma_7), eliminating proposal-likelihood mismatch and ensuring O(N^4) filtering stability."}, {"at": 1787889461.322952, "by": "planner", "note": "Skeptic identified zero-infectious exposure bug when I_t=0, E_t>0 (obstacle_12). Proposed integrated-hazard exposure probability correction (lemma_19) to restore structural validity without increasing O(N^3) complexity."}]}, "obstacle_6": {"id": "obstacle_6", "type": "obstacle", "content": "Moment Closure Problem in SEIR Factorial Moment Duality: Due to the non-linear exposure term beta * S * I / N, the infinitesimal generator of the SEIR process couples moment equations of different orders. Specifically, applying the generator to a polynomial test function of degree d yields terms of degree d+1, such as S * I^2. This infinite hierarchy of moment equations (the moment closure problem) implies that the dual process cannot be restricted to a finite state space. Exact moment-based filtering is therefore impossible without heuristic moment closure approximations, which introduce unquantifiable errors especially in low-population regimes.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488232.2248604, "updated_at": 1787488814.3740077, "history": [], "notes": [{"at": 1787488718.2602797, "by": "planner", "note": "Mathematician confirmed that the dual generator includes non-conservative terms (failing conservation conditions without Feynman-Kac weights), preventing pure Markovian dual moment filtering without additional weight tracking."}, {"at": 1787488814.374006, "by": "planner", "note": "Confirmed by mathematician derivation: infinitesimal generator application to factorial moments yields exposure terms of degree y_S + y_E + y_I + 1, proving the infinite moment hierarchy and moment closure problem for non-linear SEIR."}]}, "lemma_8": {"id": "lemma_8", "type": "lemma", "content": "Exact Krylov Subspace Filtering for Low-Population CTMC SEIR: For population N <= 50, the exact state space size is |S| = (N+3)(N+2)(N+1)/6 <= 23,426. The CTMC generator matrix Q is extremely sparse, containing at most 3 non-zero off-diagonal elements per row (corresponding to S->E, E->I, and I->R transitions). Krylov subspace projection methods (such as Arnoldi or Lanczos iterations) compute the transition action w = exp(Q^T * delta_t) * v using only sparse matrix-vector multiplications. This reduces the computational complexity per filter step to O(m * |S|) where m << |S| is the Krylov subspace dimension (typically m approx 30), enabling exact continuous-time forward filtering updates without truncating the state space.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488252.3061528, "updated_at": 1787890965.1716008, "history": []}, "obstacle_7": {"id": "obstacle_7", "type": "obstacle", "content": "Susceptible Depletion and Nonlinearity Breakdown in PGF-based Branching Approximations: Branching process approximations of epidemics (such as in approach_5 and approach_9) rely on approximating the infection rate beta * S_t * I_t / N as a linear rate beta_0 * I_t by assuming S_t is approximately constant over the interval. In low populations (e.g., N <= 50), each transition S -> E significantly decreases S_t (by 1/N, i.e., 2%), meaning the linear branching process approximation quickly overestimates the number of secondary infections. This accumulation of discretization hazard bias causes severe overestimation of the epidemic trajectory during growth phases.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488285.1041403, "updated_at": 1787488285.1041405, "history": []}, "paper_3": {"id": "paper_3", "type": "paper", "content": "Vaughan & Stadler (2025) 'Bayesian Phylodynamic Inference of Multitype Population Trajectories Using Genomic Data': Infers multitype trajectories in birth-death branching processes by integrating over trait-specific population size functions.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1787488285.113313, "updated_at": 1787488285.113313, "history": []}, "paper_4": {"id": "paper_4", "type": "paper", "content": "Laha & Majumdar (2022) 'A multi-type branching process model for epidemics with application to COVID-19': Employs a multi-type branching process with non-identical Poisson offspring distributions to model epidemics under varying parameters.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1787488285.1227999, "updated_at": 1787488285.1227999, "history": []}, "lemma_9": {"id": "lemma_9", "type": "lemma", "content": "State-Dependent Ogata Thinning for Hawkes-Based Closed SEIR: The non-linear closed-population SEIR model with total population N_pop can be exactly represented as an Ogata-thinned multi-type Hawkes process. The unconstrained linear Hawkes process has exposure intensity \\lambda_E^0(t) = \\beta I(t^-). By thinning exposure events with state-dependent probability S(t^-)/N_pop and updating S(t) = S(t^-) - 1, the resulting process exactly matches the closed-population epidemic dynamics. This preserves the branching structure of the underlying proposal process and provides an exact continuous-time representation that respects the population constraint.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488305.579901, "updated_at": 1787488305.5799015, "history": []}, "lemma_10": {"id": "lemma_10", "type": "lemma", "content": "Whittle-Barbour Coupling Bounds for Regime-Switching SEIR Branching Approximations: By Whittle's branching approximation (1955) and Stein's method for Poisson/coupling approximations (Barbour and Utev, 2004), the total variation distance between the path distribution of the exact non-linear closed SEIR jump process and its multitype branching process limit (where S_t is assumed constant) over a finite time horizon tau is bounded by d_TV(P_SEIR, P_CTMBP) <= C * (1 - S(tau)/N) * sum_{t <= tau} I_t. This explicit TV-bound defines a rigorous state-dependent threshold for when the filter should dynamically switch from a linear branching process to a closed-population model (such as CME or FSP) to control approximation error.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488344.9773893, "updated_at": 1787889317.9851887, "history": []}, "obstacle_8": {"id": "obstacle_8", "type": "obstacle", "content": "Dirichlet-Multinomial Non-Closure under SEIR Transitions: While the observation update under binomial reporting yields an exact exponentially tilted Dirichlet-Multinomial (DM) distribution, the transition step (composed of independent Binomial/Multinomial transitions for S -> E -> I -> R) does not preserve the DM functional form. Propagating the DM distribution through nonlinear or even linear binomial transitions leads to mixture distributions with rapidly expanding terms, preventing closed-form conjugate filtering across multiple time steps.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488377.6406963, "updated_at": 1787488822.0854156, "history": [], "notes": [{"at": 1787488822.085415, "by": "planner", "note": "Skeptic critique confirms that the multinomial/binomial transition step destroys the Dirichlet-Multinomial functional form, causing algebraic non-closure and compulsory projection errors."}]}, "approach_11": {"id": "approach_11", "type": "approach", "content": "State-Corrected PGF Branching Approximation (SC-PGF): A modified PGF-based branching filter that dynamically adjusts the transmission rate beta_0(t) within each observation interval to account for expected susceptible depletion (obstacle_7). This is achieved by solving a coupled deterministic ODE for expected depletion or by introducing a quadratic correction term to the characteristic ODEs, preserving FFT coefficient extraction (approach_9) while reducing discretization hazard bias.", "status": "IDEA", "created_by": "planner", "created_at": 1787488401.2618413, "updated_at": 1787895685.5631015, "history": [], "notes": [{"at": 1787890698.4622335, "by": "planner", "note": "Upgraded to PROMISING following the derivation of the local TV error bound which confirms the quadratic error scaling of the uncorrected branching model and justifies the need for state correction."}, {"at": 1787893068.6228442, "by": "planner", "note": "Rejected due to non-autonomous ODE breakdown and destruction of 2D-IFFT convolution structure under time-varying transmission rates (obstacle_15)."}]}, "lemma_11": {"id": "lemma_11", "type": "lemma", "content": "Exact and Linearized PGF PDEs for SEIR Jump Processes: Let G(u, v, w, t) = E[u^S v^E w^I] be the joint PGF. The exact continuous-time SEIR Markov chain yields a second-order PDE: dG/dt = (beta/N) * (v - u) * w * d^2G/(du dw) + sigma * (w - v) * dG/dv + gamma * (1 - w) * dG/dw. The bilinear infection term makes the PDE second-order, meaning the standard Method of Characteristics is inapplicable. However, linearizing around a constant susceptible population S_t approx S_k decouples S, reducing G(v, w, t) = E[v^E w^I] to a first-order PDE: dG/dt = beta_0 * (v - 1) * w * dG/dw + sigma * (w - v) * dG/dv + gamma * (1 - w) * dG/dw, where beta_0 = beta * S_k / N. This first-order system is exactly solvable via characteristics.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488422.251922, "updated_at": 1787488422.2519226, "history": []}, "lemma_12": {"id": "lemma_12", "type": "lemma", "content": "Exact Rao-Blackwellized State-Space Partitioning for Low-Population SEIR: Conditioning on the susceptible trajectory S_{1:t} (or exposure counts U_{1:t}) reduces the transition of the latent states (E_t, I_t) to a linear, time-varying Markov chain. The conditional distribution P(E_t, I_t | S_{1:t}, Y_{1:t-1}) can be represented as a dense matrix M_t of size at most (N+1)x(N+1). Under Binomial/Multinomial transition dynamics and Binomial reporting Y_t ~ Bin(W_t, rho), M_t is updated recursively via exact matrix multiplication of size O(N^2) per step, avoiding particle representation of the latent compartments.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488453.7638738, "updated_at": 1787488453.7638748, "history": []}, "lemma_13": {"id": "lemma_13", "type": "lemma", "content": "Analytic Marginal Likelihood and Posterior Moments for Dirichlet-Multinomial under Binomial Observations: Let the prior state distribution be Dirichlet-Multinomial $\\mathbf{X} = (S, E, I, R) \\sim \\text{DM}(N, \\boldsymbol{\\alpha})$ with $\\alpha_0 = \\sum \\alpha_k$, and let the observation model be $Y \\sim \\text{Binomial}(I, \\rho)$. The joint distribution is given by $P(\\mathbf{X}, Y=y) = \\binom{I}{y} \\rho^y (1-\\rho)^{I-y} \\frac{\\Gamma(N+1)\\Gamma(\\alpha_0)}{\\Gamma(N+\\alpha_0)} \\prod_k \\frac{\\Gamma(X_k+\\alpha_k)}{\\Gamma(X_k!)\\Gamma(\\alpha_k)}$. By grouping terms and summing over the simplex, the marginal likelihood $P(Y=y)$ simplifies to a one-dimensional sum over $I \\in \\{y, \\dots, N\\}$ of Beta-Binomial-like factors rather than an $O(N^3)$ sum over the 3D simplex. This 1D collapse enables exact and efficient computation of the posterior marginal moments $E[X_j | Y=y]$ and $E[X_j X_k | Y=y]$, which are required to project the posterior back onto the optimal Dirichlet-Multinomial parameter vector $\\boldsymbol{\\alpha}_{t|t}$ via Assumed Density Filtering.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488471.7556207, "updated_at": 1787488693.8298626, "history": []}, "lemma_14": {"id": "lemma_14", "type": "lemma", "content": "Factorial Moment Generator Action and Dual State Mappings for SEIR: For the joint state (S, E, I) with factorial power H(X, y) = (S)_{y_S} (E)_{y_E} (I)_{y_I}, the infinitesimal generator terms are: (1) Exposure: beta * S * I / N shifts the dual index since A_{exp} H = (beta / N) * I * [ (S-1)_{y_S} (E+1)_{y_E} (I)_{y_I} - (S)_{y_S} (E)_{y_E} (I)_{y_I} ], which after expansion involves terms of degree y_S + y_E + y_I + 1, confirming coupling to higher moments. (2) Transition E -> I: sigma * E * [ (E-1)_{y_E} (I+1)_{y_I} - (E)_{y_E} (I)_{y_I} ] maps to a linear combination of dual states of degree at most y_E + y_I. (3) Recovery I -> R: gamma * I * [ (I-1)_{y_I} - (I)_{y_I} ] maps to -gamma * y_I * H(X, y) plus lower-order terms. Thus, only the non-linear infection term causes the moment-closure problem, while linear transitions permit exact closed dual evolution.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488500.7456722, "updated_at": 1787488500.7456727, "history": []}, "approach_12": {"id": "approach_12", "type": "approach", "content": "Multivariate Poisson Branching Process with State-Dependent Intensity Scaling (MP-SDIC): Approximates the joint transitions using independent Poisson variables for event counts (exposures, transitions, recoveries) over a small interval dt, where the intensities are updated recursively using the current state. To handle the closed population constraint S_t + E_t + I_t + R_t = N, a multinomial scaling or a multivariate Poisson-Binomial correction is applied post-hoc to prevent negative susceptible states while preserving the branching structure and the tractability of Poisson updates.", "status": "IDEA", "created_by": "planner", "created_at": 1787488500.7892966, "updated_at": 1787488500.7892988, "history": []}, "approach_13": {"id": "approach_13", "type": "approach", "content": "Dirichlet-Multinomial Assumed Density Filtering (DM-ADF): Approximates the joint state distribution of (S_t, E_t, I_t, R_t) on the simplex as a Dirichlet-Multinomial (DM) distribution. Although the true transition step does not preserve the DM form, we compute the exact first and second-order joint moments of the state counts after the transition step (which is a mixture of multinomials) and use moment matching (ADF) to project the distribution back into the closest DM family. This provides a closed-form, extremely fast, and population-constrained recursive filter for small N.", "status": "PROMISING", "created_by": "planner", "created_at": 1787488500.8455458, "updated_at": 1787895723.7140083, "history": [], "notes": [{"at": 1787488822.093158, "by": "planner", "note": "While 1D marginal likelihood collapse (lemma_13) enables efficient moment updates, the non-closure established in obstacle_8 means DM-ADF functions as an assumed density approximation with non-zero projection bias."}]}, "obstacle_9": {"id": "obstacle_9", "type": "obstacle", "content": "Zero-Likelihood Trap and Discretization Hazard Bias at Zero-Infectious Boundary: In Piecewise Decoupled Multitype Branching Process (PD-MBP) models (approach_5, lemma_5), the transmission hazard is frozen as $h_k = \\beta I_{t_{k-1}} / N$. When $I_{t_{k-1}} = 0$ but $E_{t_{k-1}} > 0$, this leads to $h_k = 0$, implying zero probability of any new exposures ($S \\to E$) over the interval $[t_{k-1}, t_k]$. However, in the true continuous-time model, exposed individuals can transition to infectious ($E \\to I$) at some time $\\tau \\in (t_{k-1}, t_k)$, which then immediately allows new exposures to occur. This causes a complete structural failure, leading to a zero-likelihood trap in particle/Bayesian filtering where valid observations of new exposures are deemed impossible.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488523.9869475, "updated_at": 1787896618.1885877, "history": [], "notes": [{"at": 1787894923.9989321, "by": "planner", "note": "Successfully addressed and bypassed by the Volterra-based expected infectious count hazard correction lemma."}, {"at": 1787896618.1885867, "by": "planner", "note": "Resolved by the exact matrix-exponential Volterra integral hazard correction (lemma_31), providing non-zero exposure transition probabilities when I=0 and E>0."}]}, "obstacle_10": {"id": "obstacle_10", "type": "obstacle", "content": "Critical Failure Modes of Dynamic FSP in Bayesian Filtering: (1) Catastrophic filter collapse ('black swan' observations where y_t exceeds max infectious count in active set Η(t) leading to division-by-zero). (2) Systematic bias in marginal likelihood due to sub-stochastic generator truncation and artificial renormalization. (3) Topological mode amputation preventing recovery from pruned states. (4) Computational overhead paradox for N <= 100 where static sparse matrix methods (Krylov subspace) are faster than dynamic grid re-indexing.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787488686.4117758, "updated_at": 1787488686.4117765, "history": []}, "lemma_15": {"id": "lemma_15", "type": "lemma", "content": "Exponential Aliasing Error Bounds for 2D IFFT PGF Extraction: Evaluating the joint PGF G(z_E, z_I, t) = [u_E(t, z_E, z_I)]^{E_0} [u_I(t, z_E, z_I)]^{I_0} on a scaled complex polydisc boundary T^2_r = { (r_E exp(2 pi i k / M_E), r_I exp(2 pi i l / M_I)) } with r_E, r_I > 1 yields joint transition probabilities P((E_t, I_t) = (e, i)) via 2D IFFT with aliasing error bounded by O(r_E^{-M_E} + r_I^{-M_I}). For time horizons t < t_infty, u_E, u_I remain analytic in a neighborhood of the unit disc, guaranteeing exponential convergence with grid sizes M_E, M_I ~ O(N).", "status": "PROMISING", "created_by": "planner", "created_at": 1787889244.7940845, "updated_at": 1787889244.7940853, "history": []}, "lemma_16": {"id": "lemma_16", "type": "lemma", "content": "Fast O(N^3) Sequential Convolution Operator for OP-RBPF Latent State Updates: By factorizing the joint transition-observation likelihood kernel into sequential 1D binomial operators—exposure U ~ Bin(S_t, 1 - exp(-\\beta i \\Delta t / N)), progression V ~ Bin(e, p_{EI}), recovery W ~ Bin(i + v, p_{IR}), and reporting Y_t ~ Bin(w, \\rho)—the updated joint latent PMF M_{t+1}(e', i') and marginal likelihood alpha_{t+1}(S_{t+1}) are computable in O(N^3) arithmetic operations per time step. This reduces RBPF complexity from O(N^4) to O(N^3), guaranteeing scalability for low population sizes N <= 100.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889265.568131, "updated_at": 1787895520.177959, "history": [], "notes": [{"at": 1787889546.9440453, "by": "planner", "note": "Mathematical derivation of the 3-stage DAG factorization complete; verified O(N^3) arithmetic complexity per proposal."}, {"at": 1787892305.6031306, "by": "planner", "note": "Mathematician successfully factorized the transition into three sequential 1D binomial operations: $U_{t+1} \\sim \\operatorname{Bin}(S_t, p_{SE}(I_t))$, $V_{t+1} \\sim \\operatorname{Bin}(E_t, p_{EI})$, and $W_{t+1} \\sim \\operatorname{Bin}(I_t, p_{IR})$. This reduces complexity from $O(N^4)$ to $O(N^3)$ and memory to $O(N^2)$ by performing sequential 1D convolutions on the joint latent PMF matrix."}, {"at": 1787895429.1378558, "by": "planner", "note": "Verifier flagged that intermediate jump counts V and W are deterministic functions of endpoints, requiring rigorous bounds checking rather than free convolution."}, {"at": 1787895495.0604267, "by": "planner", "note": "Verifier found a fundamental gap: the sequential 1D factorization introduces O(dt^2) discretization hazard bias and does not hold exactly for continuous-time SEIR multitype branching processes."}, {"at": 1787895520.1779578, "by": "planner", "note": "Skeptic critique: Sequential 1D binomial factorization suffers from intra-interval sojourn time bias and failure of Chapman-Kolmogorov consistency over coarse Delta t intervals."}]}, "lemma_17": {"id": "lemma_17", "type": "lemma", "content": "Exact DM Non-linear Cross-Moments for SEIR Transition Matching: Under a Dirichlet-Multinomial distribution DM(N, alpha) with alpha_0 = sum_k alpha_k, joint cross-moments are given in closed form by E[S_t^a I_t^b ...] = (N! / (N - a - b)!) * ((alpha_S)_a (alpha_I)_b / (alpha_0)_{a+b}). Specifically, the expectation of the nonlinear infection rate is E[S_t I_t] = N(N-1) * (alpha_S alpha_I) / (alpha_0 (alpha_0 + 1)). This allows exact computation of mean transition rates under DM-ADF without mixture component expansion.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889279.7404795, "updated_at": 1787889279.7404804, "history": []}, "lemma_18": {"id": "lemma_18", "type": "lemma", "content": "Volterra/Hawkes Endogenous Intensity Integration for Zero-Infectious Hazard Correction: For interval (t_{k-1}, t_k] with I(t_{k-1}) = 0 and E(t_{k-1}) > 0, the expected infectious population profile is E[I(t) | E_{t_{k-1}}, I_{t_{k-1}}=0] = E(t_{k-1}) \\frac{\\sigma}{\\sigma - \\gamma} (\\exp(-\\gamma (t - t_{k-1})) - \\exp(-\\sigma (t - t_{k-1}))). Integrating this over \\Delta t yields the effective transmission hazard \\bar{h}_k = \\frac{\\beta}{N \\Delta t} \\int_{t_{k-1}}^{t_k} E[I(t)] dt = \\frac{\\beta E(t_{k-1})}{N \\Delta t} \\left[ \\frac{1 - \\exp(-\\gamma \\Delta t)}{\\gamma} - \\frac{1 - \\exp(-\\sigma \\Delta t)}{\\sigma} \\right] \\frac{\\sigma}{\\sigma - \\gamma}. Using \\bar{h}_k in place of zero hazard in PD-MBP models eliminates the zero-likelihood trap (obstacle_9) while maintaining exact discrete binomial/multinomial transition tractability.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889297.472272, "updated_at": 1787890935.686546, "history": [], "notes": [{"at": 1787889508.8441756, "by": "planner", "note": "Second-moment integral derivation confirms positive infectious hazard expectation and bounded variance under zero-infectious boundary conditions (I=0, E>0)."}, {"at": 1787889562.9050722, "by": "planner", "note": "Verifier identified GAP: Integrating interval-averaged endogenous hazard \bar{h}_k into independent single-individual PD-MBP transition matrices double-counts secondary infections and violates exact mass conservation of susceptibles."}, {"at": 1787890729.6883254, "by": "planner", "note": "Verifier confirmed that bar_h_k removes the zero-likelihood trap, but established that it carries a structural Jensen bias from concavity of 1 - exp(-x) and truncation of multi-step within-interval transmissions."}, {"at": 1787890729.723875, "by": "planner", "note": "Updated status to PROMISING with explicit Jensen-bias caveats."}]}, "obstacle_11": {"id": "obstacle_11", "type": "obstacle", "content": "Irreversible Bimodality Collapse and Posterior TV-Distance Amplification in LNA Hybrid Model Switching: Under Bayes' rule, unconditioned TV-distance bounds d_TV <= epsilon do not control posterior divergence because LNA places zero probability mass on extinction states (I=0), resulting in O(1) posterior error upon low-count observations. Additionally, switching from discrete particle representations to continuous LNA maps bimodal state distributions (extinction atomic peak vs outbreak tail) into unimodal Gaussians, permanently destroying extinction probability mass. Furthermore, Whittle-Barbour coupling bounds grow exponentially d_TV <= C (I_0^2 / N) exp(lambda t) during epidemic expansion, making online thresholding unstable.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787889317.9655807, "updated_at": 1787889317.9655817, "history": []}, "approach_14": {"id": "approach_14", "type": "approach", "content": "Three-Regime Adaptive Switching Filter (OP-RBPF / PGF 2D-IFFT / Gaussian LNA): A dynamic switching filter driven by dual Stein-Barbour total variation error bounds. Regime 1 (Low population / Extinction boundary): Uses OP-RBPF (approach_10) or Krylov CTMC to maintain discrete multimodal distributions and exact extinction boundaries. Regime 2 (Moderate population / High S): Uses PGF 2D-IFFT (approach_9) or SC-PGF (approach_11) when branching approximation bound delta_BP = d_TV(P_SEIR, P_BP) < epsilon_1. Regime 3 (Large population surge): Switches to Gaussian LNA / Ensemble Kalman Filter when diffusion bound delta_LNA = d_TV(P_BP, P_LNA) < epsilon_2. Dynamic regime selection prevents weight collapse and mitigates bimodality collapse near boundaries.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889472.284807, "updated_at": 1787891054.568242, "history": []}, "lemma_19": {"id": "lemma_19", "type": "lemma", "content": "Exact 3-Stage Sequential 1D Factorization for SEIR Latent State Updates: The joint latent transition tensor P(E_{t+1}=e', I_{t+1}=i', Y_{t+1}=y | S_{0:t+1}, Y_{1:t}) factorizes along the DAG structure S -> E -> I -> R into three sequential 1D updates: (1) Exposure progression convolution over latent E, (2) Infectious progression and recovery convolution over latent I, and (3) Binomial reporting likelihood update. Each stage operates on matrices of size at most (N+1) x (N+1) in O(N^3) operations, guaranteeing exact O(N^3) step complexity without numerical loss.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889546.9320064, "updated_at": 1787895429.1536713, "history": [], "notes": [{"at": 1787891026.3110385, "by": "planner", "note": "Mathematician formalization completed: rigorously proved exact DAG factorization into 3 sequential 1D convolutions without numerical loss, confirming O(N^3) complexity."}, {"at": 1787894930.7622483, "by": "planner", "note": "Verifier found complexity GAP: outer loop over I in sequential 1D factorization yields O(N^4) operations, not O(N^3), due to state-dependent trial parameters preventing FFT acceleration."}, {"at": 1787895429.1536682, "by": "planner", "note": "Verifier flagged that V and W are fixed by endpoints (e, i, e', i', U), correcting the summation structure."}]}, "obstacle_12": {"id": "obstacle_12", "type": "obstacle", "content": "Double-Counting and Mass Conservation Mismatch in Endogenous Hazard Integration: Substituting an interval-averaged hazard \bar{h}_k into independent single-individual Binomial/Multinomial transitions (in PD-MBP) violates independence assumptions. Individuals transitioning E -> I within interval (t_{k-1}, t_k] generate secondary infections that are double-counted by both the averaged hazard and subsequent individual state progressions, breaking exact mass conservation.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787889562.9220994, "updated_at": 1787891323.63402, "history": []}, "lemma_20": {"id": "lemma_20", "type": "lemma", "content": "Exact Continuous-Time Uniformization (Jensen's Method) for Low-Population SEIR Filtering: For population N <= 50, the closed SEIR state space size is |S| = (N+3)(N+2)(N+1)/6 <= 23,426. Transition probabilities over observation interval Delta t are computed exactly as exp(Q Delta t) v = sum_{k=0}^K exp(-gamma Delta t) ((gamma Delta t)^k / k!) B^k v, where gamma = max_i |q_{ii}| and B = I + Q/gamma is a non-negative stochastic matrix with at most 4 non-zero entries per row. Truncation order K = O(gamma Delta t + 7 sqrt(gamma Delta t)) guarantees machine-precision accuracy (~10^{-16}), completely eliminating discretization hazard bias (obstacle_4) and double-counting (obstacle_12) without needing discrete-time binomial hazard approximations.", "status": "PROMISING", "created_by": "planner", "created_at": 1787889619.6337488, "updated_at": 1787894536.8043008, "history": [], "notes": [{"at": 1787892978.6341672, "by": "planner", "note": "The exact bijective flat indexing scheme of lemma_25 provides the computational engine for sparse Jensen's uniformization, eliminating dynamic hashing overhead."}, {"at": 1787894536.8042977, "by": "planner", "note": "Explorer verified that uniformization preserves non-negativity via stochastic matrix powers, bounds eigenvalues within [0,1] to eliminate stiffness, and exactly recovers binomial thinning for 1D pure-death models. However, it is limited by high computational costs for large Lambda*Delta t (obstacle_14) and memory bandwidth bottlenecks."}]}, "lemma_21": {"id": "lemma_21", "type": "lemma", "content": "Local TV Error Bound for Epidemic Branching Approximations: Under susceptible depletion, the local total variation (TV) distance between the exact continuous-time Markov chain (CME) transition distribution and the multitype branching process (MBP) approximation over a time step \\Delta t is bounded at leading order by \\frac{1}{2} \\beta^2 \\frac{S_0}{N^2} I_0^2 (\\Delta t)^2 + O((\\Delta t)^3). This shows that uncorrected branching processes suffer from quadratic local error in time and population-dependent degradation. The State-Corrected PGF (SC-PGF) addresses this by adjusting the hazard dynamically to nullify the $O((\\Delta t)^2)$ term.", "status": "PROMISING", "created_by": "planner", "created_at": 1787890698.422169, "updated_at": 1787890698.4221702, "history": []}, "obstacle_13": {"id": "obstacle_13", "type": "obstacle", "content": "Numerical Stiffness and Catastrophic Precision Loss in PGF Characteristic-ODE and FFT Coefficient Extraction: For R_0 = beta_0/gamma > 1, the backward characteristic ODE system has a stable fixed point at u* = (gamma/beta_0, gamma/beta_0) inside the unit polydisc D^2. For large time steps Delta t or during rapid outbreak phases, characteristic trajectories starting on the unit boundary |z_E|=1, |z_I|=1 contract exponentially fast toward u*. Consequently, the joint PGF G(z_E, z_I, Delta t) = [u_E(Delta t)]^{E_0} [u_I(Delta t)]^{I_0} becomes nearly uniform across the evaluation grid, leading to catastrophic loss of precision (numerical underflow or loss of significance) when extracting transition probabilities via 2D IFFT under standard double-precision arithmetic.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787890872.954976, "updated_at": 1787895731.0792284, "history": [], "notes": [{"at": 1787893104.7583823, "by": "planner", "note": "Analytic stabilization derivations for 2D-IFFT polydisc scaling hit token limits (task_63), indicating high analytical complexity."}, {"at": 1787894889.8583047, "by": "planner", "note": "Confirmed via phase space analysis that for R_0 > 2, stable manifold contraction maps the unit circle to an epsilon-neighborhood of u*, inducing catastrophic floating-point cancellation in 2D IFFT."}, {"at": 1787895731.0792274, "by": "planner", "note": "Addressed by the Volterra product-integration time-domain FFT scheme with predictor-corrector Picard iteration (lemma_volterra_fft)."}]}, "approach_15": {"id": "approach_15", "type": "approach", "content": "Unified Multi-Regime Filtering Architecture (UMRF): A dynamic multi-regime filter designed for low-to-moderate populations (N <= 1000). It partitions the state space into three computational regimes: (1) N <= 50: Optimal Proposal Rao-Blackwellized Particle Filter (OP-RBPF) or exact continuous-time uniformization to handle extinction boundaries and zero-hazard corrections. (2) 50 < N <= 200: State-Corrected PGF (SC-PGF) with 2D-IFFT coefficient extraction to capture non-linearities and discrete transitions. (3) N > 200: Dirichlet-Multinomial Assumed Density Filter (DM-ADF) to enforce population conservation and run extremely fast, bypassing Gaussian/LNA boundary breakdowns near low-count regimes.", "status": "PROMISING", "created_by": "planner", "created_at": 1787890896.930813, "updated_at": 1787895769.8931777, "history": [], "notes": [{"at": 1787894948.6734369, "by": "planner", "note": "Integrated two-tiered hybrid filtering combining DM-ADF bulk propagation with OP-RBPF boundary mass atomization to address extinction resurrection and bimodality loss."}, {"at": 1787895665.6802049, "by": "planner", "note": "Refined UMRF architecture with precise population partitions: Micro-regime (N <= 20) using exact CTMC uniformization/Krylov; Meso-regime (20 < N <= 100) using FFT-accelerated OP-RBPF; Macro-regime (N > 100) using Dirichlet-Multinomial ADF or LNA."}, {"at": 1787895769.8931773, "by": "planner", "note": "Critically evaluated by skeptic: suffers from boundary discontinuities, Gibbs phenomena in Fourier grid reconstruction, covariance reset shocks, and likelihood calibration jumps at regime thresholds N=50 and N=200."}]}, "lemma_22": {"id": "lemma_22", "type": "lemma", "content": "Inter-Regime Representation Mapping and Information Handoff: Methods to transition representations across regime boundaries. (1) Particle-to-DM: Given M particles of state (S, E, I, R), compute empirical mean and covariance on the simplex and solve the moment-matching equations to set the Dirichlet-Multinomial parameter alpha. (2) DM-to-Particle: Directly draw multinomial samples from the DM distribution. (3) Joint Matrix-to-DM: For joint latent PMF matrix M_t(e, i) and susceptible count S_t, compute joint moments of the four compartments and fit alpha. This preserves population constraints and covariance structures across transitions.", "status": "PROMISING", "created_by": "planner", "created_at": 1787890896.9478283, "updated_at": 1787890896.947829, "history": []}, "lemma_23": {"id": "lemma_23", "type": "lemma", "content": "Comparative Complexity and Boundary Stability of Low-Population SEIR Filters:\n1. Exact Krylov CTMC (lemma_8): Complexity $O(m N^3)$ where $m$ is the Krylov subspace dimension (typically $\\approx 30$). Memory is $O(N^3)$ to store vectors of state-space size. It has absolute numerical stability, is immune to the zero-infectious boundary hazard, and is exact, but scales cubically, limiting applicability to $N \\le 100$.\n2. Optimal Proposal RBPF (approach_10, lemma_16): Complexity is $O(N^3)$ via 1D sequential convolutions. Memory is $O(N^2)$ to store the latent joint PMF matrix. It is highly stable, eliminates proposal weight collapse, and when augmented with Volterra hazard corrections (lemma_18), it is immune to the zero-infectious boundary trap.\n3. State-Corrected PGF with 2D IFFT (approach_11): Complexity is $O(M^2 \\log M)$ with grid size $M \\approx N$. Memory is $O(M^2)$. It is highly vulnerable to numerical stiffness (loss of precision) for large $\\Delta t$ due to characteristic trajectory contraction, and requires explicit correction at the $I_t=0$ boundary.\n4. Dirichlet-Multinomial ADF (approach_13): Complexity is $O(N)$ or $O(1)$ under 1D moment collapse (lemma_13). Memory is $O(1)$ (storing only parameters $\\boldsymbol{\\alpha}$). It is highly scalable but susceptible to boundary approximation errors, as the Dirichlet-Multinomial cannot represent absorbing extinction states as an exact atomic mass without modification.", "status": "PROMISING", "created_by": "planner", "created_at": 1787890918.3444805, "updated_at": 1787892670.5903842, "history": [], "notes": [{"at": 1787892306.0882432, "by": "planner", "note": "Completed analysis: 1. Exact Krylov CTMC: $O(m N^3)$ time, $O(N^3)$ memory. Exact, but limited to $N \\le 100$. 2. OP-RBPF: $O(N^3)$ time, $O(N^2)$ memory. Highly stable with Volterra correction, eliminates weight collapse. 3. SC-PGF with 2D IFFT: $O(M^2 \\log M)$ time, $O(M^2)$ memory. Vulnerable to stiffness. 4. DM-ADF: $O(N)$ or $O(1)$ time, $O(1)$ memory. Fast, preserves population constraint but approximate."}]}, "lemma_24": {"id": "lemma_24", "type": "lemma", "content": "Topological DAG Ordering and Block-Triangular Solvers for exact SEIR CME: Because the physical transitions in the SEIR model are uni-directional (S -> E -> I -> R), the joint CTMC state transition graph is a Directed Acyclic Graph (DAG) when ordered by the state vector x = (S, E, I). The generator matrix Q is strictly upper-triangular under this topological ordering. This upper-triangular structure allows the continuous-time Master Equation (CME) or its action exp(Q * Delta t) * v to be computed via sequential forward-substitution or specialized block-triangular exponentiation algorithms, potentially reducing computational complexity and bypassing general Krylov subspace iterations.", "status": "PROMISING", "created_by": "planner", "created_at": 1787892927.1483343, "updated_at": 1787892927.1483355, "history": []}, "lemma_25": {"id": "lemma_25", "type": "lemma", "content": "Exact Flat Indexing Bijection for Closed SEIR State Space: For a closed population $N$, the physical state is uniquely identified by the triple $(s, e, i)$ with $s + e + i \\le N$. We can establish a direct, contiguous 1D index mapping $I(s, e, i) \\in \\{0, \\dots, |S|-1\\}$ where $|S| = (N+3)(N+2)(N+1)/6$, ordered lexicographically by descending susceptible count $s$, then by exposure count $e$, and then by infectious count $i$. The exact bijective mapping is given by $I(s, e, i) = \\sum_{j=s+1}^{N} \\frac{(N-j+2)(N-j+1)}{2} + \\sum_{k=0}^{e-1} (N - s - k + 1) + i$, where the first term is the cumulative state count of all pages with susceptible population larger than $s$, the second term is the cumulative state count of the current page for exposures less than $e$, and the final term is the index offset for $i$. This mapping enables $O(1)$ direct index calculations and direct generation of sparse CSR/CSC matrix structures without dynamic hashing.", "status": "PROMISING", "created_by": "planner", "created_at": 1787892978.6083639, "updated_at": 1787895502.4117444, "history": []}, "obstacle_14": {"id": "obstacle_14", "type": "obstacle", "content": "Global Rate Inflation and Computational Explosion of Jensen's Uniformization at Peak Epidemic Intensity: Jensen's uniformization (Poisson randomization) requires a scaling rate $\\Lambda \\ge \\max_x |q_{xx}| \\approx N \\cdot \\max(\\beta/4 + \\gamma/2, \\sigma, \\gamma)$ that scales linearly with the total population $N$. Near peak epidemic intensity (where $S \\approx I \\approx N/2$), or for long observation intervals $\\Delta t$, the Poisson parameter $\\Lambda \\Delta t$ becomes extremely large. This necessitates a very high truncation order $K = O(\\Lambda \\Delta t + 7 \\sqrt{\\Lambda \\Delta t})$ (often $K > 1000$ matrix-vector multiplications), leading to excessive computational cost and loss of efficiency compared to adaptive Krylov subspace solvers or specialized DAG block-triangular CME updates.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787892998.583859, "updated_at": 1787895535.9845133, "history": [], "notes": [{"at": 1787895535.984512, "by": "planner", "note": "Resolved by the adaptive hybrid uniformization-Krylov solver (lemma_30), which switches from uniformization to Arnoldi subspace projection when Omega = Lambda * Delta t > 100."}]}, "paper_5": {"id": "paper_5", "type": "paper", "content": "McKinley, T. J., Cook, A. R., & Deardon, R. (2009). Inference in Epidemic Models without Likelihoods. The International Journal of Biostatistics. Discusses MCMC and Sequential Monte Carlo (SMC) algorithms for epidemic models using approximate likelihoods from simulations, providing foundational context for partially observed epidemic filtering and likelihood-free approximations.", "status": "POTENTIALLY_RELEVANT", "created_by": "planner", "created_at": 1787893006.2504725, "updated_at": 1787893006.2504737, "history": []}, "approach_16": {"id": "approach_16", "type": "approach", "content": "Tensor Train (TT) and Quantized Tensor Train (QTT) Representation for Metapopulation SEIR Hazard Operators: For a K-patch SEIR model, the joint state space size scales as O(N^(3K)). To bypass this curse of dimensionality, the joint probability tensor and the integrated hazard tensor are decomposed into a Tensor Train format, where each core tensor represents local patch dynamics and the TT-ranks are bounded by the coupling or migration network dimensions. This allows linear-complexity representation of the multitype Master Equation over network structures.", "status": "IDEA", "created_by": "planner", "created_at": 1787893307.3317678, "updated_at": 1787893307.3317685, "history": []}, "obstacle_15": {"id": "obstacle_15", "type": "obstacle", "content": "TT-Rank Explosion and Loss of Sparsity under Nonlinear Transmission Coupling in Metapopulation SEIR: While migration operators admit low-rank Kronecker representations, the nonlinear exposure rate \\beta_k S_k I_k / N_k couples local patch variables and causes the Tensor Train (TT) rank of the integrated hazard tensor to grow rapidly over intervals \\Delta t. Near extinction boundaries (I_k -> 0), the proliferated absorbing states cause ill-conditioning in TT-rounding algorithms, resulting in severe approximation errors and loss of tensor representation efficiency.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787893307.349175, "updated_at": 1787893307.3491757, "history": []}, "obstacle_16": {"id": "obstacle_16", "type": "obstacle", "content": "Non-Commutativity and Magnus Expansion Errors in Time-Varying Metapopulation Hazard Tensors: Because the generator matrices Q(t_1) and Q(t_2) do not commute due to rapid population transitions and depletion, the integrated hazard operator cannot be represented as a simple matrix exponential of the time-integrated generator. Approximation via a first-order Magnus expansion or Baker-Campbell-Hausdorff (BCH) truncation introduces systematic O(\\Delta t^2) or higher errors that propagate through the HMM/filtering steps.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787893307.363281, "updated_at": 1787893307.3632815, "history": []}, "obstacle_17": {"id": "obstacle_17", "type": "obstacle", "content": "Unobservable Silent Extinction and Ghost Outbreaks under Small Reporting Rate in Exact CME Filtering: When the reporting rate \\rho \\ll 1, the likelihood ratio under zero reports between an active low-prevalence state (e.g., I=1, E=1) and the extinction state (I=0, E=0) is approximately 1/(1-\\rho)^{\\Delta I} \\approx 1+\\rho. This extremely weak statistical gradient prevents the forward posterior probability from collapsing onto the absorbing state after extinction, causing filters to hallucinate persistent 'ghost outbreaks' with artificially high posterior variance long after the disease has vanished.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894248.0600977, "updated_at": 1787894248.060099, "history": []}, "obstacle_18": {"id": "obstacle_18", "type": "obstacle", "content": "Fisher Information Collapse and Parameter Unidentifiability in Small-Pop SEIR with Small Reporting Rates: With a low reporting rate \\rho \\ll 1, the observation process acts as a severe Bernoulli thin of the discrete jumps in the SEIR model. This causes the Fisher information matrix to decay exponentially as a function of \\rho, leading to flat log-likelihood plateaus and vanishing gradients for the parameters (\\beta, \\gamma). Consequently, even with an exact continuous-time Markov chain solver, the parameters are practically unidentifiable from sparse observation data.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894248.0755742, "updated_at": 1787894248.0755746, "history": []}, "approach_17": {"id": "approach_17", "type": "approach", "content": "Exact Forward-Filtering Backward-Smoothing (FFBS) for Low-Population SEIR CTMC: To resolve the 'ghost outbreak' problem, we can apply an exact forward-filtering backward-smoothing algorithm. While the forward filter cannot immediately identify extinction due to low-reporting rates, future zero-incidence reports eventually accumulate sufficient evidence to retrospectively confirm extinction. FFBS computes the smoothed joint probability P(X_t | Y_{1:T}) by propagating back the marginals using the transpose of the transition matrix Q, thereby retroactively collapsing the probability mass onto the extinction manifold.", "status": "PROMISING", "created_by": "planner", "created_at": 1787894248.091747, "updated_at": 1787895527.8451748, "history": [], "notes": [{"at": 1787894610.6726406, "by": "planner", "note": "Updated with findings showing that MDM-ADF allows exact component-wise updates under binomial observations and successfully tracks extinction-outbreak bimodality near critical thresholds."}, {"at": 1787895527.845174, "by": "planner", "note": "Added approach for Kernel Bayes' Rule (KBR) Filtering with RKHS Embeddings for intractable likelihoods."}]}, "obstacle_19": {"id": "obstacle_19", "type": "obstacle", "content": "Absorbing-State Discontinuity and Extinction Resurrection in Hybrid DM-ADF Switching: When switching from discrete exact filters (like OP-RBPF) to the Dirichlet-Multinomial Assumed Density Filter (DM-ADF), the discrete state is projected onto the continuous simplex. Near extinction, where I_t = 0 or E_t = 0 on the integer lattice, moment-matched DM parameters alpha_i either encounter numerical singularities (alpha_i -> 0) or assign positive probability to I_t > 0 and E_t > 0 due to the open support of the Dirichlet distribution. This causes 'extinction resurrection' (or 'zombie outbreaks'), where extinct chains are artificially revived.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894518.2987127, "updated_at": 1787894518.298714, "history": []}, "obstacle_20": {"id": "obstacle_20", "type": "obstacle", "content": "Bimodality Destruction and Posterior Uncertainty Underestimation in DM-ADF Moment Matching: In low-population SEIR regimes (N <= 50) near the epidemic threshold R_0 approx 1, the true state distribution is strongly bimodal, representing a split between immediate stochastic extinction and a major outbreak. The DM-ADF forces a unimodal Dirichlet-Multinomial shape by matching only the first and second moments. This destroys the bimodal geometry, resulting in severe underestimation of posterior epistemic uncertainty and a huge KL-divergence spike at the transition boundary.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894518.312705, "updated_at": 1787894518.3127062, "history": []}, "obstacle_21": {"id": "obstacle_21", "type": "obstacle", "content": "Representation Chattering and Threshold Hysteresis in Multi-Regime SEIR Filters: A hard, count-based threshold for switching regimes (e.g., switching to OP-RBPF when I_t <= k and to DM-ADF/SC-PGF when I_t > k) causes high-frequency representation 'ping-ponging' or chattering due to stochastic observation noise. Since the underlying filters use fundamentally incompatible representation spaces (discrete lattice PMFs, continuous Dirichlet densities, and Fourier-truncated PGFs), there is no measure-preserving mapping between them, causing artificial discontinuous jumps in predictive likelihoods and trajectory smoothing.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894518.3289585, "updated_at": 1787894518.3289592, "history": []}, "obstacle_22": {"id": "obstacle_22", "type": "obstacle", "content": "Memory Bandwidth Bottleneck in Iterative Sparse Products for Jensen's Uniformization: For population sizes $N \\ge 50$, the state space size $|S|$ exceeds 23,426, and the probability vector $v$ and generator matrix $Q$ (or stochastic matrix $P_J$) must be repeatedly accessed. In Jensen's uniformization, computing $v^{(k)} = v^{(k-1)} P_J$ for $k = 1, \\dots, K_{max}$ requires streaming the entire vector $v$ of size $O(N^3)$ and the sparse matrix entries from memory to cache $K_{max}$ times. Since $K_{max} = O(\\Lambda \\Delta t)$ can be in the hundreds or thousands, this creates a severe memory bandwidth bottleneck on modern CPU/GPU architectures, where memory access latency dominates the floating-point computation time.", "status": "OBSTACLE", "created_by": "planner", "created_at": 1787894536.8185132, "updated_at": 1787894536.8185134, "history": []}, "obstacle_23": {"id": "obstacle_23", "type": "obstacle", "content": "Parameter Collapse and Negative Concentration Parameters in Dirichlet-Multinomial Moment Matching: Projecting exact mean and covariance onto the Dirichlet-M
