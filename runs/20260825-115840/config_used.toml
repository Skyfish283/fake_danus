[run]
mode = "main"
problem = "Explore different applications and ways to classify MCMC algorithms using a resolvent method. Specifically, think about how we can do this when we do not know the posterior distribution. ie, how can we use the concept of resolvency to perhaps improve convergene rates, identify when we have metastability, etc..."
