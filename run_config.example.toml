# Run configuration for the agentic mathematical research system.
#
# Copy this file to run_config.toml, fill in at least one API key, then run:
#
#     cd C:\Users\samfe\OneDrive\Desktop
#     python -m math_agent
#
# The command line takes no arguments: everything about a run lives here.
# run_config.toml is gitignored so an inline key never lands in a repo.


[run]
# main            = the full agentic system (arm C)
# baseline_a      = one Gemini call (arm A)
# baseline_b      = three workers in parallel plus a synthesis call (arm B)
# baselines_both  = arms A and B in one run
mode = "main"

problem = """
Does every bounded harmonic function on a complete Riemannian manifold with
non-negative Ricci curvature have to be constant?
"""

# If set, the file's contents replace `problem` above.
problem_file = ""

# Label appended to the run directory name, e.g. runs/20260822-140000-pilot.
tag = ""

# Path to an existing run directory to continue from its graph.json.
resume = ""


[budget]
# Whichever cap trips first ends the run cleanly and still writes summary.md.
# Each autonomous worker slot uses its own API key (worker_1, worker_2, etc.).
max_planner_calls = 40
max_worker_calls = 30
max_wall_clock_seconds = 1800
max_concurrent_workers = 6   # number of worker keys needed in [api_keys]


[models]
# Whole-run provider. Every role uses this backend; mixing Gemini and GLM
# in one run is not allowed.
#   gemini | glm
provider = "gemini"
# Model IDs must match the provider, or adaptive:
#   gemini: gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash,
#           gemini-3.5-flash-lite, adaptive
#   glm:    glm-4.7-flash, adaptive
# adaptive walks the [adaptive] ladder for that provider, stepping down when a
# model is busy and stepping back up once it recovers
planner = "adaptive"
# Worker models are used by autonomous workers (all slots share explorer pool)
worker = "gemini-3.5-flash"
baseline = "gemini-3.5-flash"


[thinking]
# LOW, MEDIUM or HIGH. Gemini 3 Flash uses thinking_level. GLM-4.7-Flash
# maps LOW to thinking off and MEDIUM/HIGH to thinking on (no reasoning_effort).
planner = "HIGH"
worker = "MEDIUM"


[api_keys]
# Planner has its own key. Each worker slot gets its own key.
# Number of worker keys should match max_concurrent_workers in [budget].
# A blank role falls back to `default`, then to GEMINI_API_KEY when
# provider = "gemini", or ZAI_API_KEY when provider = "glm".
# Keys are never printed or written into a run directory.
default = ""
planner = ""
worker_1 = ""
worker_2 = ""
worker_3 = ""
worker_4 = ""
worker_5 = ""
worker_6 = ""
baseline = ""


[adaptive]
# Tried in order by any role set to "adaptive". Entries must belong to the
# current [models] provider. A model that answers 429 or 503 is demoted for
# cooldown_seconds, then probed again.
# Gemini default: 3.7-flash -> 3.6-flash -> 3.5-flash -> 3.5-flash-lite
# GLM default if omitted: glm-4.7-flash
ladder = [
    "gemini-3.7-flash",
    "gemini-3.6-flash",
    "gemini-3.5-flash",
    "gemini-3.5-flash-lite",
]
cooldown_seconds = 180


[literature]
# OpenAlex routes requests to its polite pool when given a contact address.
openalex_mailto = "math-agent-prototype@example.com"
search_result_limit = 8


[viewer]
# Draws the research graph in a browser as the run builds it, by watching the
# graph.json and events.jsonl the run already writes. Read-only, bound to
# 127.0.0.1 only, and never able to affect the run.
enabled = true
port = 8765          # 0 picks any free port
open_browser = true
poll_ms = 1000       # how often the page asks for changes

# Turn `enabled` off to keep a run's console to itself, and watch it from
# another window instead:  python -m math_agent.viewer
